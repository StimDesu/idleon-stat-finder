<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IdleOn Stat Finder</title>
<meta name="description" content="Legends of Idleon: pick a stat (drop rate, cooking speed, lab line width...) and see every bonus in the game that raises it, read from the game code.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#f7f8fb; --ink:#1b1f33; --muted:#666c86; --line:#dcdfea;

  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --blue:#8fb2ff; --blue-bg:#1b2648; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --blue:#8fb2ff; --blue-bg:#1b2648; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em}
h1 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.02em}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border:0;border-radius:0;padding:4px 10px;font:600 12px var(--mono);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:820px){.side{position:static;max-height:none}}
input[type=search]{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink)}
.cat h3{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:3px 10px;font:500 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip b{font:600 11px var(--mono);color:var(--muted)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.chip[aria-pressed="true"] b{color:var(--blue)}
.res-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.res-head .n{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px}
.tools button{font:500 13px var(--body);background:none;border:0;color:var(--blue);cursor:pointer;padding:0}
details.sys{border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
details.sys>summary{cursor:pointer;padding:8px 12px;font-weight:600;display:flex;gap:8px;align-items:baseline;list-style:none}
details.sys>summary::-webkit-details-marker{display:none}
details.sys>summary::before{content:"▸";color:var(--muted);width:10px}
details.sys[open]>summary::before{content:"▾"}
details.sys>summary .c{font:600 12px var(--mono);color:var(--muted)}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr);gap:4px 12px;padding:7px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}}
.row .nm{font-weight:600}
.row .tx{white-space:pre-line;overflow-wrap:anywhere}
.row .alt{color:var(--muted);font-size:12px;white-space:pre-line}
i.n{font-style:normal;font:600 12px var(--mono);color:var(--gold);background:var(--gold-bg);border-radius:3px;padding:0 3px}
mark{background:var(--gold-bg);color:inherit;border-radius:2px}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:12px}
footer{color:var(--muted);font-size:12px}
footer a{color:inherit}
</style>
</head>

</div>

e Well! You'll need to expand your Gravel bar to hold the 130 needed to create this!","Добавляет ещё одно ведро у колодца! Расширь шкалу гравия, чтобы вместить 130, нужные для него!"],[49,"3rd Bucket!","3-е ведро!","Adds another bucket at the Well! Remember, click a bucket to change what sediment it collects! That's how you get this gold resource!","Добавляет ещё одно ведро у колодца! Нажми на ведро, чтобы сменить собираемый осадок! Так добывается этот золотой ресурс!"],[49,"4th Bucket!","4-е ведро!","Adds yet another bucket at the Well!","Добавляет ещё одно ведро у колодца!"],[49,"Five Nights at Bucket","Пять ночей у ведра","Adds one more bucket at the Well! Five buckets!!! WOW! That's worth writing home about!","Добавляет ещё одно ведро у колодца! Пять вёдер!!! ОГО! Есть о чём написать домой!"],[49,"6th Bucket!","6-е ведро!","Adds another bucket at the Well! I guess 5 wasn't enough for a go getter like yourself!","Добавляет ещё одно ведро у колодца! Видимо, такому деятелю, как ты, 5 мало!"],[49,"7rth Barckot?!","7-е вёдрышко?!","Adds another bucket at the Well! You DO want more buckets, right?","Добавляет ещё одно ведро у колодца! Тебе ведь ХОЧЕТСЯ больше вёдер, да?"],[49,"Last Bucket!","Последнее ведро!","Adds another bucket at the Well! And it's the last one too, I hope your bucket lust is satiated!","Добавляет ещё одно ведро у колодца! И оно последнее, надеюсь, жажда вёдер утолена!"],[49,"9th Bucket!","9-е ведро!","Adds another bucket at the Well! Yea apparently there were a few more of these left!","Добавляет ещё одно ведро у колодца! Ага, оказывается, их осталось ещё несколько!"],[49,"Bucket Finale!","Ведро-финал!","Adds another bucket at the Well! And yea this one is actually the last one, I don't think an 11th would fit on screen!","Добавляет ещё одно ведро у колодца! И да, вот это правда последнее, 11-е уже на экран не влезет!"],[49,"Bar Expand-o-rama","Расширямба шкал","Adds the 'Expand Full Bars' toggle to the Well! Let me explain... when a bar is full of sediment, you lose half of the sediment, but permanently increase the max by 1.50x!","Добавляет колодцу переключатель «Расширять полные шкалы»! Объясняю... когда шкала полна осадка, теряешь половину, но максимум навсегда растёт в 1.50 раза!"],[49,"UBER Bar Expand-o-rama-hala","УБЕР-расширямба-халамба шкал","Allow for UBER Full Bar Expansion, which means you can expand Well Bars beyond the previous limit of 14 times.","Позволяет УБЕР-расширение шкал: шкалы колодца можно расширять сверх прежнего предела в 14 раз."],[49,"Expander Extravaganza","Расширительная феерия","Gives all your buckets +20% Fill Rate per bar expansion across all sediment types! This includes Uber expansions later!\nTotal Bonus: +{%","Все вёдра получают +20% к наполнению за каждое расширение шкалы любого осадка! Включая будущие убер-расширения!\nВсего: +{%"],[49,"Motherlode ~ Bucket Synergy","Синергия жилы ~ вёдер","Gives all your buckets 1.10x fill rate per Motherlode Layer you've destroyed!\nTotal Bonus: {x","Все вёдра наполняются в 1.10 раза быстрее за каждый разрушенный слой материнской жилы!\nВсего: {x"],[49,"Green Amplifier","Зелёный усилитель","Adds a new Amplifier stone to interact with at the Dawg Den!","Добавляет новый камень-усилитель в «Собачьем логове»!"],[49,"Pink Amplifier","Розовый усилитель","Adds a new Amplifier stone to interact with at the Dawg Den!","Добавляет новый камень-усилитель в «Собачьем логове»!"],[49,"Yellow Amplifier","Жёлтый усилитель","Adds a new Amplifier stone to interact with at the Dawg Den!","Добавляет новый камень-усилитель в «Собачьем логове»!"],[49,"Cyan Amplifier","Голубой усилитель","Adds a new Amplifier stone to interact with at the Dawg Den!","Добавляет новый камень-усилитель в «Собачьем логове»!"],[49,"Purple Amplifier","Фиолетовый усилитель","Adds a new Amplifier stone to interact with at the Dawg Den!","Добавляет новый камень-усилитель в «Собачьем логове»!"],[49,"White Amplifier","Белый усилитель","Adds a new Amplifier stone to interact with at the ez String","Струна Соль","Permanently unlocks a new String Type for the Harp! You can level it up just like any other string, getting +1 EXP per 100% Harp Power!","Навсегда открывает новый тип струны арфы! Качается как любая другая: +1 опыт за каждые 100% силы арфы!"],[49,"Aye String","Струна Ля","Permanently unlocks a new String Type for the Harp! You can level it up just like any other string!","Навсегда открывает новый тип струны арфы! Качается как любая другая!"],[49,"Bee String","Струна Си","Permanently unlocks a new String Type for the Harp! You can level it up just like any other string!","Навсегда открывает новый тип струны арфы! Качается как любая другая!"],[49,"Loaded Harp","Заряженная арфа","Adds +1 more string to the Harp, ready to be strummed until the end of (the) time (signature)!","Добавляет арфе +1 струну, готовую звучать до скончания (размера) времён!"],[49,"Packed Harp","Набитая арфа","Adds +1 more string to the Harp, you'll find it right next to all your other strings!","Добавляет арфе +1 струну, она прямо рядом с остальными!"],[49,"Hefty Harp","Увесистая арфа","Adds +1 more string to the Harp, it even makes sound when strummed! The other ones do too, but like, this one does too! Just incase you were worried it wouldn't.","Добавляет арфе +1 струну, она даже звучит! Остальные тоже, но, типа, и эта тоже! На случай, если ты волновался."],[49,"Multitudinal Harp","Многострунная арфа","Adds +9999 more strings to the Harp! Haha nah just +1 string, figured I'd keep you on your toes! If I tricked you, you must go pluck the F string.","Добавляет арфе +9999 струн! Ха-ха, нет, всего +1, решил тебя взбодрить! Если я тебя провёл, иди дёрни струну Фа."],[49,"Sumptuous Harp","Роскошная арфа","Adds +1 more string to the Harp... all these strings really remind me of string cheese, I used to love it!","Добавляет арфе +1 струну... все эти струны напоминают мне сыр-косичку, я его обожал!"],[49,"Domino Effect","Эффект домино","Strings give +20% more per string plucked during a strum... let me explain. Imagine you have 5 strings, this would mean the final string you pluck would be worth DOUBLE!","Каждая задетая за проход струна даёт на +20% больше... объясняю. Если струн 5, последняя задетая даст ВДВОЕ больше!"],[49,"Variety Effect","Эффект разнообразия","Strings give +30% more for each unique string type on your harp... I see you currently have $ different strings on your harp, so your strings are all worth #% more!","Струны дают на +30% больше за каждый тип струн на арфе... вижу, у тебя $ разных, так что все струны на #% ценнее!"],[49,"Stringy Effect","Струнный эффект","Strings give +15% more.\nMore what, you ask? More everything! They give more String EXP, more notes, higher chance for opal... so yea, MORE!","Струны дают на +15% больше.\nБольше чего? Всего! Больше опыта струн, больше нот, выше шанс опала... в общем, БОЛЬШЕ!"],[49,"Reroll Keeper","Хранитель перебросов","Each unused reroll you have in a Bravery Story gives +10% Sword Max DMG. So don't be all loosey goosey with those rerolls!","Каждый неиспользованный переброс в истории храбрости даёт +10% к макс. урону мечей. Так что не разбрасывайся ими!"],[49,"Fractalfly ~ Harp Synergy","Синергия фракталомухи ~ арфы","Boosts your Harp Note production by 1.10x per Undying Hive Layer you've destroyed!\nTotal Bonus: {x","Ноты арфы в 1.10 раза быстрее за каждый разрушенный слой бессмертного улья!\nВсего: {x"],[49,"Double Dinger Ringer","Двойной звонарь","Ringing the Bell now has a +30% chance of giving +2 LV to a bonus, instead of just +1 LV","Звон в колокол с шансом +30% даёт бонусу +2 ур. вместо +1"],[49,"RNG Oxidizing Layer","Окислительный слой рандома","When you Clean the Bell and FAIL to get a new Improvement Method, the success chance for next time goes up by 1.25x. This happens every fail, and resets when you finally succeed!","Если чистка колокола НЕ дала новый способ улучшения, шанс в следующий раз растёт в 1.25 раза. Так при каждом провале, сбрасывается при успехе!"],[49,"Gloomie Mulch","Мрачная мульча","Gloomie mushrooms respawn +10% faster! In fact, ALL monsters across all the worlds of IdleOn respawn +10% faster!","Мрачные грибы возрождаются на +10% быстрее! Да и ВСЕ монстры во всех мирах IdleOn тоже!"],[49,"Improvement Stackin'","Копим улучшения","For every 25 LVs across all Improvement Methods upgrades at the Bell, all your Improvement Method bonuses are 1.10x higher!\nTotal bonus: }x","За каждые 25 ур. всех способов улучшения у колокола их бонусы в 1.10 раза больше!\nВсего: }x"],[49,"Gloomie Lootie","Мрачная добыча","+5% Drop Rate for each Colony of Gloomie Mushrooms defeated! Drop rate here as in like, the one for stuff outside of the Caverns.\nTotal Bonus: +{%","+5% к шансу дропа за каждую побеждённую колонию мрачных грибов! Шанс дропа тот, что вне пещер.\nВсего: +{%"],[49,"Gloomie Expie","Мрачный опыт","+25% Class EXP gain for each Colony of Gloomie Mushrooms defeated!\nTotal Bonus: +{%","+25% опыта класса за каждую побеждённую колонию мрачных грибов!\nВсего: +{%"],[49,"Gloomie Opie","Мрачные опалы","+10% Villager EXP gain for each Colony of Gloomie Mushrooms successfully romanced... or defeated, whichever is higher.\nTotal Bonus: +{%","+10% опыта жителей за каждую колонию мрачных грибов, которую ты соблазнил... или победил, что больше.\nВсего: +{%"],[49,"Motherlode Trickledown","Просачивание жилы","+15% All Skill Efficiency, and +10% All Skill EXP gain per Motherlode Layer you've destroyed!","+15% эфф. всех навыков и +10% опыта всех навыков за каждый разрушенный слой материнской жилы!"],[49,"Fractalfly Trickledown","Просачивание фракталомухи","+15% All Skill Efficiency, and +10% All Skill EXP gain per Undying Hive Layer you've destroyed!","+15% эфф. всех навыков и +10% опыта всех навыков за каждый разрушенный слой бессмертного улья!"],[49,"Rift Guy","Парень из разлома","Hey bet you weren't expecting to see me here, huh? Well, that's just how it goes with me, it's in my blood. It's how I roll. Go ahead, create me. Or don't  к наполнению вёдер за каждый порядок добытой руды жилы. Добыто уже #!\nВсего: +{/ч к наполнению"],[49,"Hiring the Hounds from Beyond","Найм гончих из запределья","Gives +10 B.F.R. per 100 hounds defeated in best runs of each class. 尬 Beginner:!, Warrior:#, Archer:$, Mage:%\nTotal Bonus: +{/hr Bucket Fill Rate (B.F.R.)","+10 С.Н.В. за каждые 100 гончих в лучших забегах каждого класса. 尬 Новичок:!, Воин:#, Лучник:$, Маг:%\nВсего: +{/ч к скорости наполнения вёдер (С.Н.В.)"],[49,"Triple Tap Tinkle","Тройной звон","Ringing the Bell now has another +30% chance of giving +2 LV to a bonus instead of just +1 LV. Also, there's a new +20% chance of giving +3 LV instead of +2 or +1!","Звон в колокол получает ещё +30% шанса дать +2 ур. вместо +1. И новый шанс +20% дать +3 ур. вместо +2 или +1!"],[49,"Compound Interest","Сложный процент","You start with +1 more Court Coins every Power of 2 HRs of AFK time at the Justice Monument! So 2Hrs you get +1 coin, 4Hrs you get +2 coins, 8Hrs you get +3 coins, and so on!","+1 монета суда на старте за каждую степень 2 часов AFK у монумента справедливости! 2 ч: +1, 4 ч: +2, 8 ч: +3 и так далее!"],[49,"Big Jar Mach II","Большой кувшин мк. II","Upgrades the main jar, doubling the base value of every rupie you find. So if you see 2 red rupies, you actually got 4!","Улучшает главный кувшин: базовая ценность каждой рупии удваивается. Видишь 2 красные рупии, а на деле их 4!"],[49,"Big Jar Mach III","Большой кувшин мк. III","Upgrades the main jar, allowing you to produce 2 jar types at once!","Улучшает главный кувшин: можно производить 2 типа кувшинов сразу!"],[49,"Big Jar Mach IV","Большой кувшин мк. IV","Upgrades the main jar, increasing the chance for multiple rupies in a jar by +50%","Улучшает главный кувшин: +50% к шансу нескольких рупий в кувшине"],[49,"Big Jar Mach V","Большой кувшин мк. V","Upgrades the main jar, doubling the base value of every rupie you find AGAIN! If 2 red rupies gave you 4 before, now it's 8!!!","Улучшает главный кувшин: базовая ценность рупий СНОВА удваивается! Если 2 красные давали 4, теперь 8!!!"],[49,"Big Jar Mach VI","Большой кувшин мк. VI","Upgrades the main jar, allowing you to produce 3 jar types at once!","Улучшает главный кувшин: можно производить 3 типа кувшинов сразу!"],[49,"Big Jar Mach VII","Большой кувшин мк. VII","Upgrades the main jar, reducing the production amount required to make jars by 30% so you can make them faster!","Улучшает главный кувшин: на кувшин нужно на 30% меньше производства, делаются быстрее!"],[49,"Big Jar Mach VIII","Большой кувшин мк. VIII","Upgrades the main jar, doubling the base value of every rupie you find! This does not stack with the other ones... just kidding it totally does! ANOTHER 2x RUPIES!!!","Улучшает главный кувшин: базовая ценность рупий удваивается! С прошлыми не складывается... шучу, ещё как складывается! ЕЩЁ x2 РУПИЙ!!!"],[49,"Break All Button","Кнопка «Разбить всё»","Adds a new button to the top left of the Jar, allowing you to break all jars at once!","Добавляет кнопку слева вверху у кувшина, чтобы разбить все кувшины разом!"],[49,"Max Monument Rewards","Макс. награды монументов","Monument Reward Multi now increases at the normal rate of +100% daily for 4 full days! Before this upgrade, it was only 2 days...","Множитель наград монументов растёт обычным темпом +100% в день целых 4 дня! До улучшения было всего 2..."],[49,"Supergiant Jars","Сверхгигантские кувшины","Jars now COMBINE to save space! 10 Jars becomes 1 large jar, which gives 10x rewards. 10 large jars become 1 giant jar, which gives 100x rewards. This continues forever!","Кувшины теперь ОБЪЕДИНЯЮТСЯ ради места! 10 кувшинов становятся 1 большим с x10 наградой. 10 больших в 1 гигантский с x100. И так бесконечно!"],[49,"Light Speed","Скорость света","Every POW 10 white rupies you own increases the production rate of jars by +10%\nTotal Bonus: +{% Jar Producton Rate","Каждый порядок белых рупий ускоряет производство кувшинов на +10%\nВсего: +{%"],[49,"Dark Luck","Тёмная удача","Every POW 10 dark rupies you own increases the chance of enchanting collectibles from the Enchanted Jar by 1.10x\nTotal Bonus: {x Enchantment","Каждый порядок тёмных рупий повышает шанс зачарованных находок из зачарованного кувшина в 1.10 раза\nВсего: {x"],[49,"Jar Production Line","Конвейер кувшинов","The requirement to make a jar is 5% lower per POW 10 jars made of the previous type. For example, making 100 Simple Jars would mean Tall jars are 10% quicker to make!","Требование на кувшин на 5% ниже за каждый порядок кувшинов предыдущего типа. Например, 100 простых кувшинов ускорят высокие на 10%!"],[49,"Advanced Collection","Продвинутая коллекция","You can now find new collectible types from jars, found in the new 2nd page of your collection! Go collect 'em all!","Из кувшинов теперь выпадают новые коллекционные предметы, они на новой 2-й странице коллекции! Собери их все!"],[49,"Collect 'Em All","Собери их все","Gives a 1.02x chance to find a new collectible for every digit of all the rupies you own.\nTotal Bonus: {x Collectible Chance","x1.02 к шансу новой находки за каждую цифру всех твоих рупий.\nВсего: {x"],[49,"Roaring Flame","Ревущее пламя","+25% chance to get DOUBLE the Torches from Ancient Golems when picking them up!","+25% шанс получить ВДВОЕ больше факелов с древних големов!"],[49,"The Sicilian","Сицилианская защита","+10% Total Gambit Score","+10% к общему счёту гамбита"],[49,"Evertree Trickledown","Просачивание вечного дерева","+15% All Skill Efficiency, and +10% All Skill EXP gain per Evertree Trunk you've whittled!","+15% эфф. всех навыков и +10% опыта всех навыков за каждый обстроганный ствол вечного дерева!"],[49,"Evertree ~ Rupie Synergy","Синергия вечного дерева ~ рупий","Boosts overall Rupie value by 1.10x per Evertree Trunk you've whittled!\nTotal Bonus: {x","x1.10 к ценности рупий за каждый обстроганный ствол вечного дерева!\nВсего: {x"],[49,"Rock Smart","Каменная мудрость","After much thought, this schematic has decided to give +20% Monument AFK gain, and +2 Starting Attempts for the Wisdom Story per POW 10 Wisdom Monument Hours.","Поразмыслив, этот чертёж решил давать +20% AFK монументов и +2 стартовые попытки истории мудрости за каждый порядок часов у монумента мудрости."],[49,"Sanctum of LOOT","Святилище ДОБЫЧИ","+20% Drop Rate for each Sanctum of Ancient Golems you've cleared!\nTotal Bonus: +{%","+20% к шансу дропа за каждое зачищенное святилище древних големов!\nВсего: +{%"],[49,"Sanctum of EXP","Святилище ОПЫТА","+40% Class EXP for each Sanctum of Ancient Golems you've cleared!\nTotal Bonus: +{%","+40% опыта класса за каждое зачищенное святилище древних големов!\nВсего: +{%"],[49,"Sanctum of DMG","Святилище УРОНА","+100% Total Damage for each Sanctum of Ancient Golems you've cleared!\nTotal Bonus: +{%","+100% общего урона за каждое зачищенное святилище древних големов!\nВсего: +{%"],[49,"Peer Reviewed Books","Рецензируемые книги","Bolaia now get +7% Study Rate per LV, instead of the previous +5% per LV!","Болайя получает +7% к скорости изучения за уровень вместо +5%!"],[49,"All This Ringing in my Ears","Звон в ушах","When Ringing the Bell, there is now a 25% chance to get 2x more LVs than you otherwise would have gotten!","При звоне в колокол 25% шанс получить вдвое больше уровней!"],[49,"Cutting Edge Research","Передовые исследования","Bolaia now get a massive +10% Study Rate per LV, instead of the previous +7% per LV!","Болайя получает целых +10% к скорости изучения за уровень вместо +7%!"],[49,"Billion Dollar Grant","Грант на миллиард","Bolaia now get a sumptuous +15% Study Rate per LV, instead of the previous +10% per LV!","Болайя получает роскошные +15% к скорости изучения за уровень вместо +10%!"],[49,"Horsey Gambit","Гамбит лошадки","Unlocks the Horsey challenge in the Gambit cavern.","Открывает испытание лошадки в пещере гамбита."],[49,"Bishop Gambit","Гамбит слона","Unlocks the Bishop challenge in the Gambit cavern.","Открывает испытание слона в пещере гамбита."],[49,"Queen Ga ан","Saffron Shaker now generates $ hour's worth of Bucks, not just 1 hour!","Шафранница теперь даёт баксы за $ ч, а не за 1 час!"],[55,"Charcoal Fireplace","Угольный очаг","Unlock a new Fireplace! This default red charcoal fire increases Fuel generation by +1% per Tier of Sushi in the column above it.","Открывает новый очаг! Обычный красный угольный огонь даёт +1% к выработке топлива за каждую ступень суши в столбце над ним."],[55,"Copper Firelighter","Медный розжиг","Fireplaces can be changed to blue. Sushi above blue fires have a {% chance of getting +2 tiers instead of +1, so long as it's not your highest tier.","Очаги можно сделать синими. Суши над синим огнём с шансом {% получают +2 ступени вместо +1, если это не твоя высшая ступень."],[55,"Potassium Firelighter","Калиевый розжиг","Fireplaces can be changed to purple, which each give +1蒲/sec\n$","Очаги можно сделать фиолетовыми, каждый даёт +1蒲/сек\n$"],[55,"Lithium Firelighter","Литиевый розжиг","Fireplaces can be changed to pink. Sushi above pink fires generate $x more Knowledge EXP by all methods and means of doing so! Think about it.","Очаги можно сделать розовыми. Суши над розовым огнём получают в $x больше опыта знаний всеми способами! Подумай об этом."],[55,"Barium Firelighter","Бариевый розжиг","Fireplaces can be changed to green. Sushi above green fires generate $x more Bucks.","Очаги можно сделать зелёными. Суши над зелёным огнём дают в $x больше баксов."],[55,"Overtuned Fuel","Перенастроенное топливо","When you generate fuel while at max capacity, you get +1 识\n$","Когда топливо вырабатывается при полном запасе, получаешь +1 识\n$"],[55,"Heat of the East Wind","Жар восточного ветра","When a sushi is combined, it tiers-up the sushi to its right, but only if that sushi is lower tiered.\nThis only works on sushi Tier $ and lower.","При соединении суши повышают ступень суши справа, если та ниже.\nРаботает только для суши ступени $ и ниже."],[55,"Customer Surcharge I","Наценка для клиентов I","All your su s the combo. Get a perma Bucks Multi based on your best combo!","Соединение суши добавляет в шкалу комбо очки, равные полученной ступени, но готовка новых суши ИЛИ долгая пауза обрывают комбо. Лучшее комбо даёт постоянный множитель баксов!"],[55,"No Tax on Tips","Чаевые без налогов","Multiplies all Bucks earned by }x","}x ко всем баксам"],[55,"Hourly Wage Meter","Счётчик почасовой оплаты","Adds a display to the Top Right of the Sushi Station which shows total Hourly Bucks generated by all your sushi.\nAlso, +{% total Bucks generated by all sushi!","Добавляет справа вверху суши-станции табло с баксами в час от всех суши.\nИ +{% ко всем баксам!"],[55,"Movement Mittens","Рукавицы перемещения","Adds the MOVE button. Enabling this option lets you drag the SLOTS themselves around your Sushi Station, instead of the sushi.","Добавляет кнопку «ДВИГАТЬ». С ней можно перетаскивать сами СЛОТЫ суши-станции, а не суши."],[55,"Sushi Tier Vision","Видение ступеней суши","Adds a toggle button to the Top Left of the Sushi Station. Click it to show Sushi Tiers numerically, can be turned off any time.\nAlso, +{% total Bucks generated by all sushi!","Добавляет переключатель слева вверху суши-станции. Нажми, чтобы видеть ступени суши числами, можно выключить когда угодно.\nИ +{% ко всем баксам!"],[55,"Sushi Service Bonuses","Бонусы суши-сервиса","Creating a new sushi type gives a new IdleOn bonus for the REST of the game! Check them out in the BONUS tap, top right corner.","Каждый новый вид суши даёт новый бонус IdleOn на ВСЮ оставшуюся игру! Смотри их во вкладке «БОНУС» справа вверху."],[55,"Rift Guy's Upgrade","Улучшение парня из разлома","I've got my hands in everything! Minehead, farming, the rift... so yea, of course I'm in the Sushi biz too, don't be so shocked.","У меня руки повсюду! Шахтоголов, ферма, разлом... так что да, конечно, я и в суши-бизнесе, не удивляйся так."],[56,"Amoeba Cell Cultivation","Выращивание амёб","Unlock the Amoeba Cell! Drag it from the Petri Dish onto any Jelly Slot, and it'll automatically attack during the Operation!\nIts passive effect of +10% Cell DMG affects all cells!","Открывает амёбу! Перетащи её из чашки Петри в любую ячейку желе, и она сама будет атаковать во время операции!\nЕё пассивка +10% урона клеток действует на все клетки!"],[56,"Plasmid Cell Cultivation","Выращивание плазмид","Unlock the Plasmid Cell! It's bigger than the Amoeba, but has better stats and a different Passive Effect, which boosts all Cell SPD by +15%","Открывает плазмиду! Она больше амёбы, но сильнее, и её пассивка ускоряет все клетки на +15%"],[56,"Ribosome Cell Cultivation","Выращивание рибосом","Unlock the Ribosome Cell! Tall, slender, with a massive +50% all Cell DMG passive effect!","Открывает рибосому! Высокая, стройная, с мощной пассивкой +50% урона всех клеток!"],[56,"Organelle Cell Cultivation","Выращивание органелл","Unlock the Organelle Cell! This oddly shaped unit multiplies the attack SPD of all nearby cells it touches by 1.50x, not to mention its passive effect of +25% all Cell SPD!","Открывает органеллу! Эта странная клетка ускоряет атаку всех соприкасающихся клеток в 1.50 раза, не говоря о пассивке +25% скорости всех клеток!"],[56,"Immunoid Cell Cultivation","Выращивание иммуноидов","Unlock the Immunoid Cell! It takes aggro during Critical Condition, while also inflicting a stun effect on the obstruction, delaying its next attack further!","Открывает иммуноид! В критическом состоянии притягивает агро и оглушает закупорку, откладывая её следующую атаку!"],[56,"Virus Cell Cultivation","Выращивание вирусов","Unlock the Virus Cell! These infect every slot of nearby cells, with each infected slot multiplying all unit damage by 1.10x","Открывает вирус! Заражает все ячейки соседних клеток, и каждая заражённая умножает урон всех на 1.10"],[56,"Mitochondria Cell Cultivation","Выращивание митохондрий","Unlock the Mitochondria Cell! Their passive effect is a massive 1.50x all Cell SPD multiplier!","Открывает митохондрию! Её пассивка: мощный множитель скорости всех клеток x1.50!"],[56,"Gigacyst Cell Cultivation","Выращивание гигацист","Unlock the Gigacyst Cell! Their passive effect is a gigantic 3x all Cell DMG multiplier!","Открывает гигацисту! Её пассивка: гигантский множитель урона всех клеток x3!"],[56,"Another Unlock","Ещё одно открытие","Gives you +1 more 'slot unlocks' to use!","+1 «открытие ячейки»!"],[56,"Slot Unlocking","Открытие ячеек","You can now unlock more slots to place Cells in!\nYou currently have $ slot unlocks left, use them wisely!","Теперь можно открывать новые ячейки для клеток!\nОсталось $ открытий, трать с умом!"],[56,"Cell Biology","Клеточная биология","Cells now gain +$ EXP every time they attack!\nEach LV boosts that cell's damage permanently by 1.01x\nAlso this upgrade gives +{% Cell EXP gain, why not right?","Клетки получают +$ опыта за каждую атаку!\nКаждый уровень навсегда усиливает урон клетки в 1.01 раза\nИ ещё +{% опыта клеток, почему бы и нет?"],[56,"Cell Evolution","Эволюция клеток","Multiply the EXP gain for all cells by }x when dealing damage!","}x опыта всех клеток при нанесении урона!"],[56,"DPS Biometrics","Биометрия DPS","Adds the DPS Biometer! Get a permanent multiplier to Bloodcell gain based on your best ever DPS!","Добавляет биометр DPS! Постоянный множитель кровяных телец по твоему рекордному DPS!"],[56,"Proximity Stimulus","Стимул близости","During the Operation, cells whose core are in any slot next to the obstruction deal }x DMG and SPD. This is designated by the green symbol!","Во время операции клетки, чьё ядро рядом с закупоркой, получают }x урона и скорости. Отмечено зелёным символом!"],[56,"Cells of Three, Better They Be!","Клетки по три, сильнее они!","Every 3rd, 6th, 9th, 12th, etc, of a specific cell type placed in the Jelly gives 2x more passive effect than normal!\nFor example, the 3rd Amoeba gives +20% not +10% DMG!","Каждая 3-я, 6-я, 9-я, 12-я и т. д. клетка одного типа в желе даёт вдвое больше пассивки!\nНапример, 3-я амёба даёт +20%, а не +10% урона!"],[56,"Viral Injection","Вирусная инъекция","Increases the total number of Virus Cells you can place in the Jelly! Currently, you can only place $ Virus Cells.","Увеличивает число вирусов, которые можно поместить в желе! Сейчас можно только $."],[56,"Feverizer",null,"Unlock the Fever Inducer tool, allowing you to freely select from { different effects which last for the whole Operation!","Открывает жаропонижа... то есть жаронагнетатель: можно выбрать один из { эффектов на всю операцию!"],[56,"Cell Mutilation","Увечье клеток","Cells now get a +$% DMG multi per Cell LV!","Клетки получают +$% к множителю урона за каждый ур. клетки!"],[56,"Cell Destruction I","Разрушение клеток I","Boost the damage of all Cells by +{% during the Operation","+{% урона всех клеток во время операции"],[56,"Cell Destruction II","Разрушение клеток II","Boost the damage of all Cells by an extra +{% during the Operation","Ещё +{% урона всех клеток во время операции"],[56,"Cell Destruction III","Разрушение клеток III","Boost the damage of all Cells by a further +{% during the Operation","И ещё +{% урона всех клеток во время операции"],[56,"Cell Desolation I","Опустошение клеток I","Multiply the damage of all Cells by }x during the Operation","}x урона всех клеток во время операции"],[56,"Cell Desolation II","Опустошение клеток II","Multiply the damage of all Cells by }x during the Operation","}x урона всех клеток во время операции"],[56,"Bloodcell Coagulation","Свёртывание кровяных телец","You now get +$ Bloodcells every 1 DMG dealt!\nThis is currency, spend them on upgrades!\nThis upgrade gives +{% Bloodcell Gain.","+$ кровяных телец за каждую единицу урона!\nЭто валюта, трать на улучшения!\nУлучшение даёт +{% кровяных телец."],[56,"Bloodletting I","Кровопускание I","Earn +{% more Bloodcells during the Operation","+{% кровяных телец во время операции"],[56,"Bloodletting II","Кровопускание II","Earn an extra +{% more Bloodcells during the Operation","Ещё +{% кровяных те hat I'm a description I haven't really tried to.","Объекты могут ронять... ну, я вообще-то не уверен.\nВ вики пишут, что это есть в игре, но кто знает. Мне ни разу не выпадало, но я всего лишь описание, так что особо и не пытался."],[59,"Shadow Strike","Теневой удар","When striking an object, {% chance for a Shadow Strike to trigger. These mimick your strike on nearby objects without using any Stamina!","При ударе по объекту {% шанс теневого удара. Он повторяет твой удар по ближайшим объектам, не тратя выносливость!"],[59,"More Shadow Strikes","Больше теневых ударов","Shadow strikes have a {% chance of triggering multiple times instead of just once","Теневые удары с шансом {% срабатывают несколько раз, а не один"],[59,"Critical Impact","Критический удар","You now deal +{% more damage to objects","Теперь наносишь объектам на +{% больше урона"],[59,"Overpow Technique","Техника сверхСИЛЫ","You now deal 2x damage to objects if you have 10x their POW Required, 3x damage if you have 100x POW, 4x damage if 1000x POW, and so on...","Теперь наносишь объектам x2 урона, если у тебя в 10 раз больше нужной СИЛЫ, x3 при x100, x4 при x1000 и так далее..."],[59,"Jobs All Done","Работа сделана","Clearing an entire Depth of all objects gives a +{% bonus multiplier to amber found for the rest of the delve.\nSo yea, this bonus resets at the start of every new delve.","Полная зачистка глубины даёт +{% к множителю янтаря до конца вылазки.\nНу да, бонус сбрасывается в начале каждой новой вылазки."],[59,"Hidden Elixirs","Скрытые эликсиры","Every 5th Depth, there will always be one object that drops an elixir! So you can find an elixir somewhere on Depth 5, 10, 15, 20, and so on.","На каждой 5-й глубине всегда есть объект, роняющий эликсир! То есть эликсир найдётся на глубине 5, 10, 15, 20 и так далее."],[59,"Partaking in Skull Fluid","Причащение черепной жидкостью","Defeating the lore boss now drops { elixirs! This can only happen once per run though...","Сюжетный босс теперь роняет { эликсиров! Но только раз за вылазку..."],[59,"Nova Blast","Взрыв новой","Trigger a Nova Blast when running out of stamina on any player except the last. These have a $% chance of hitting each object!","Взрыв новой, когда у любого игрока, кроме последнего, кончается выносливость. Шанс $% задеть каждый объект!"],[59,"Nova X Elixir Crossover Events","Кроссовер новой и эликсиров","When using an elixir, you have a {% chance of triggering a Nova Blast!","При использовании эликсира {% шанс взрыва новой!"],[59,"Min-Maxed Nova Blasts","Минмаксные взрывы новой","Nova Blasts now deal damage equal to that of the best tool you've unlocked, which is the $ that does #x Damage!","Взрывы новой теперь бьют как лучший открытый инструмент: $, x# урона!"],[59,"The Green Amber Clause of the Contract","Пункт контракта о зелёном янтаре","Forget Blue, you now deal in Green Amber, worth 1M Blue Amber (or 1B Orange Amber) each. As a reward for staying committed to our agreements, you get +{% more amber.","Забудь про синий, теперь ты торгуешь зелёным янтарём, каждый стоит 1M синего (или 1B оранжевого). За верность нашим соглашениям +{% янтаря."],[59,"Amber Mitosis","Митоз янтаря","Objects now have a {% chance to drop DOUBLE amber when being destroyed","Разрушенные объекты с шансом {% роняют ДВОЙНОЙ янтарь"],[59,"Grand Discoveries","Великие открытия","When destroying the final object type of a tunnel, there is a 1 in $ chance of making a Grand Discovery. This can be done 10 times per tunnel, with each additional Grand Discovery being 2x rarer than the last...","При разрушении объекта последнего типа в туннеле шанс 1 из $ на великое открытие. До 10 раз на туннель, и каждое следующее в 2 раза реже..."],[59,"Grandiose Amber","Грандиозный янтарь","Each Grand Discovery you make boosts amber by +{%. This is a new multiplier, so it's super great!\nTotal Bonus:+$% Amber","Каждое великое открытие +{% янтаря. Это новый множитель, так что супер!\nВсего:+$% янтаря"],[59,"Grandiose EXP","Грандиозный опыт","Each Grand Discovery you make boosts Spelunking EXP Gain by +{%. This is an additive bonus, so it's super mid!\nTotal Bonus:+$% Spelunking EXP","Каждое великое открытие +{% опыта спелеологии. Это аддитивный бонус, так что так себе!\nВсего:+$% опыта спелеологии"],[59,"Grandiose POW","Грандиозная СИЛА","Each Grand Discovery you make boots POW by +{%. This is a new multiplier, so it's super great!\nTotal Bonus:+$% Total POW","Каждое великое открытие +{% СИЛЫ. Это новый множитель, так что супер!\nВсего:+$% общей СИЛЫ"],[59,"Mirage Hardhat","Каска-мираж","Kattlekruk gives +{% more LVs to his bubbles every day.","Каттлекрук каждый день даёт своим пузырям на +{% больше уровней."],[59,"Grey Hardhat","Серая каска","When a '2x Statue Drop' occurs, it comes with an additional +{% Statues. This of course stacks with Whallamus's Yellow 6 Legend Talent...\nImagine explaining that last part to a player back in 2021...","При «двойном дропе статуй» выпадает ещё +{% статуй. Конечно, складывается с жёлтым легендарным талантом 6 Валламуса...\nПредставь, как объяснить это игроку из 2021..."],[59,"Turquoise Hardhat","Бирюзовая каска","}x more resources dropped for all W6 Masterclasses! Bones, Dust, Tachyons, what more could you ask for?","}x ресурсов всем мастер-классам мира 6! Кости, пыль, тахионы, чего ещё желать?"],[59,"Golden Hardhat","Золотая каска","+{% Drop Rate. For all characters, all the time, except for the past. Only works starting now!","+{% к шансу дропа. Для всех персонажей, всегда, кроме прошлого. Работает только с этого момента!"],[59,"The Red Amber Fine Print of the Contract","Мелкий шрифт контракта о красном янтаре","Green was yesterday's news. Now, you deal in Red Amber, worth 1T Green Amber (or 1000QQ Orange Amber) each. As a reward for not suing over these contract changes, you get +{% more amber.","Зелёный — это вчерашний день. Теперь ты торгуешь красным янтарём, каждый стоит 1T зелёного (или 1000QQ оранжевого). За то, что не засудил нас за изменения контракта, +{% янтаря."],[59,"Amber Be Here","Янтарь тут как тут","Amber now drops +{% more often from destroying rocks, moving you ever closer to your childhood dreams of having 100% Amber Drop Chance!","Янтарь из камней падает на +{% чаще, приближая тебя к детской мечте о 100% шансе янтаря!"],[59,"Manic Mode","Маниакальный режим","You can now toggle Manic Mode ON and OFF before entering a tunnel. When ON, Stamina Costs are 30x higher, but you get credited with a new 'Manic Best Depth' for the tunnel!","Теперь перед входом в туннель можно ВКЛ/ВЫКЛ маниакальный режим. Когда ВКЛ, выносливость тратится в 30 раз быстрее, зато засчитывается новый «маниакальный рекорд глубины»!"],[59,"Manic POW","Маниакальная СИЛА","+{% POW. This bonus is increased by 1.05x for every Manic Depth you've reached across all tunnels, which is currently ^!\nTotal Bonus:+$% POW","+{% СИЛЫ. Бонус растёт в 1.05x за каждую маниакальную глубину во всех туннелях, сейчас их ^!\nВсего:+$% СИЛЫ"],[59,"Manic Discoveries","Маниакальные открытия","+{% Grand Discovery Chance. This bonus is increased by 1.05x for every Manic Depth you've reached across all tunnels, which is currently ^!\nTotal Bonus:+$% Grand Discovery Chance","+{% к шансу великого открытия. Бонус растёт в 1.05x за каждую маниакальную глубину во всех туннелях, сейчас их ^!\nВсего:+$% к шансу великого открытия"],[59,"Manic Efficiency","Маниакальная эффективность","+{% Spelunking Efficiency. This bonus is increased by 1.05x for every Manic Depth you've reached across all tunnels, which is currently ^!\nTotal Bonus:+$% Spelunking Efficiency","+{% эффективности спелеологии. Бонус растёт в 1.05x за каждую маниакальную глубину во всех туннелях, сейчас их ^!\nВсего:+$% эффективности спелеологии"],[59,"Elixir Memorization","Запоминание эликсиров","Hold down on an Elixir Option (the 12 on the left-side) to memorize it. You start every run with one usage of each memorize elixir!\nYou can memorize up to { different elixirs.","Зажми вариант эликсира (12 слева), чтобы з  first with Cosmic Balls though!","Омега-шары увеличивают бонус улучшений магазина золотых шаров В ШЕСТЬ РАЗ! Но сначала надо улучшить до «Супер» космическими шарами!"],[68,"","","This is the Hardmode version of the Breeding Arena, with enemies having more HP, dealing more DMG, and giving a NEW set of bonuses!","Это сложная версия арены разведения: у врагов больше ОЗ, они бьют сильнее и дают НОВЫЙ набор бонусов!"],[68,"","","Each Shiny LV above 20 is +1 OverLV, which multiply Mob DMG and Shiny LV Up Rate","Каждый блестящий ур. выше 20 даёт +1 сверхуровень, он умножает урон питомца и скорость прокачки блеска"],[68,"","","Each LV of a Nightmariner above 600 boosts the Nightmariner Bonuses, shown in the Top-Left of the Sailing Crew Tab","Каждый ур. кошмарного морехода выше 600 усиливает их бонусы (слева вверху во вкладке экипажа)"],[68,"","","During Worship, the first Trait you select for each Wizard counts for DOUBLE, and is shown in gold.","В поклонении первая выбранная черта каждого мага считается ДВАЖДЫ и подсвечена золотом."],[68,"","","Each Tier is 2x rarer than the last, making a T11 Tiny Cog about a 1 in 2000 chance!","Каждая ступень в 2 раза реже предыдущей, так что шанс на шестерёнку 11-й ступени примерно 1 из 2000!"],[68,"","","This means the Laissez Maize and Chocotastic Muffin now give multiplicative bonuses instead of additive!","Значит, «Лессе-маис» и «Шокотастический маффин» теперь дают мультипликативные бонусы, а не аддитивные!"],[69,"","","Weapon Power",null],[69,"","","Cardboard Boxes","Картонные коробки"],[69,"","","Silkskin Boxes","Шёлковые коробки"],[69,"","","Wooden Crates","Деревянные ящики"],[69,"","","Natural Crates","Природные ящики"],[69,"","","Steel Trapper","Стальной капкан"],[69,"","","Meaty Trapper","Мясной капкан"],[69,"","","Royal Trapper","Королевский капкан"],[69,"","","Goblin Gorefest","Гоблинская резня"],[69,"","","Wakawaka War","Вакавака-война"],[69,"","","Acorn Assault","Желудиный штурм"],[69,"","","Frosty Firefight","Морозная перестрелка"],[69,"","","Clash of Cans","Битва банок"],[69,"","","Tower Defence 6","Защита башен 6"],[69,"","","Tower Defence 7","Защита башен 7"],[69,"","","Build this space to unlock the 3D Printer.","Построй это место, чтобы открыть 3D-принтер."],[69,"","","Build this space to unlock the Library. Wow! What a game changer!","Построй это место, чтобы открыть библиотеку. Ух! Вот это поворот!"],[69,"","","Build this space to get your very own Death Note thingy. Anime doesn't actually exist around here, so wipe that smirk off your face!","Построй это место, чтобы получить свою собственную тетрадь смерти. Аниме тут вообще-то нет, так что сотри ухмылку!"],[69,"","","Build this space to unlock a way to unlock other bonuses using Salt! Its almost like you're Summoning more bonuses with Salt, so you can speedrun the game faster!","Построй это место, чтобы открывать другие бонусы за соль! Ты как будто призываешь бонусы солью, чтобы спидранить игру быстрее!"],[69,"","","Build this space to get more Storage Chest slots! I KNOW RIGHT? It's about time!!","Построй это место, чтобы получить больше ячеек хранилища! ДА, Я ЗНАЮ! Давно пора!!"],[69,"","","Build this space to make upgrading other Buildings way easier. Ok, maybe just easier, not 'way easier'.","Построй это место, чтобы улучшать другие здания намного легче. Ну, просто легче, не «намного»."],[69,"","","Build this space to remotely place, collect and remove Critter Traps to and from any location! This done changin' the Trap Game fo' real yo!","Построй это место, чтобы ставить, собирать и убирать ловушки удалённо откуда угодно! Это реально меняет всю ловушечную игру, йоу!"],[69,"","","Build this space to harness the power of Automation! Good thing you're a gamer, thats a job that robots will never replace.","Построй это место, чтобы обуздать силу автоматизации! Хорошо, что ты геймер, эту работу роботы никогда не отнимут."],[69,"","","Build this space because it's the last one... I mean what else are you gonna do?","Построй это место, потому что оно последнее... ну а что тебе ещё делать?"],[69,"","","Build this space to get your first Wizard Defender. This one will zap nearby monsters as they run by!","Построй это место, чтобы получить первого мага-защитника. Он бьёт током пробегающих монстров!"],[69,"","","Build this space to get your second Wizard Defender. This one will throw exploding fireballs toward monsters, which explode! Did I mention the fireballs EXPLODE!","Построй это место, чтобы получить второго мага-защитника. Он кидает во монстров взрывающиеся огненные шары, которые взрываются! Я говорил, что они ВЗРЫВАЮТСЯ!"],[69,"","","Build this space to get your third Wizard Defender. This one will roll a boulder at the monsters, squashing them into inedible pancakes!","Построй это место, чтобы получить третьего мага-защитника. Он катит на монстров валун, раскатывая их в несъедобные блины!"],[69,"","","Build this space to get your fourth Wizard Defender. This one will freeze monsters... pretty cool, right?","Построй это место, чтобы получить четвёртого мага-защитника. Он замораживает монстров... круто (и холодно), да?"],[69,"","","Build this space to get your fifth Wizard Defender. This one will smite the monsters for their sins! I mean, sure, you're the one murdering them, but they're monsters!","Построй это место, чтобы получить пятого мага-защитника. Он карает монстров за грехи! Ну да, убиваешь их ты, но они же монстры!"],[69,"","","Build this space to get your sixth Wizard Defender. This one will rock and roll all night, and party every day! I don't know how he got his wizarding license, but he did and now that's your problem!","Построй это место, чтобы получить шестого мага-защитника. Он будет рок-н-роллить всю ночь и тусить каждый день! Не знаю, как он получил лицензию мага, но получил, и теперь это твоя проблема!"],[69,"","","Build this space to get your seventh Wizard Defender. This one will summon giant eyeballs, which boop into enemies! Eye think you're gonna love this one!","Построй это место, чтобы получить седьмого мага-защитника. Он призывает гигантские глаза, которые бодают врагов! Глаз даю, тебе понравится!"],[69,"","","Build this space to get your eigth Wizard Defender. This one is real smelly. That's his thing, he stinks.","Построй это место, чтобы получить восьмого мага-защитника. Он жутко вонючий. Это его фишка, он воняет."],[69,"","","Build this space to get your last Wizard Defender. This one is crazy good... kinda makes all the other tower wizards pointless.","Построй это место, чтобы получить последнего мага-защитника. Он безумно хорош... как будто все остальные маги становятся не нужны."],[69,"","","Build this space to get your first Shrine. You can place it anywhere in the game, and it will boost all characters in that map! This one boosts damage!","Построй это место, чтобы получить первое святилище. Ставь его где угодно, и оно усилит всех персонажей на этой карте! Это усиливает урон!"],[69,"","","Build this space to get your second Shrine. This one is full of life, as well as pulmonary veins and arteries.","Построй это место, чтобы получить второе святилище. Оно полно жизни, а также лёгочных вен и артерий."],[69,"","","Build this space to get your third Shrine! This one is a bit of a brain bender, it's kinda like a shrine for shrines.","Построй это место, чтобы получить третье святилище! Оно немного ломает мозг, это как святилище для святилищ."],[69,"","","Build this space to get your fourth Shrine. This one's for all you institutional bankers out there! I'm sure I speak for everyone born after 2008 when I say, you're the best!","Построй это место, чтобы получить четвёртое святилище. Оно для всех банкиров! Уверен, что говорю от лица всех, кто родился после 2008: вы лучшие!"],[69,"","","Build this space to get your fifth Shrine. This one is green.","Построй это место, чтобы получить пятое святилище. Оно зелёное."],[69,"","","Build this space to get your sixth Shrine. This one is a pile of books, which will somehow give you a boost even though we both know you don't read.","Построй это место, чтобы получить шестое святилище. Это стопка книг, которая как-то тебя усилит, хотя мы оба знаем, что ты не читаешь."],[69,"","","Build this space to get your seventh Shrine. This one is practically worthless, and will be forgotten about within a week of being unlocked.","Построй это место, чтобы получить седьмое святилище. Оно почти бесполезное, и о нём забудут через неделю после открытия."],[69,"","","Build this space to get your eigth Shrine! Dang, we're close to the end, I'm gonna miss vaguely describing upcoming shrines to you! Anyway, this one's spooky and scary.","Построй это место, чтобы получить восьмое святилище! Блин, мы почти у конца, буду скучать по туманным описаниям святилищ! В общем, это жуткое и страшное."],[69,"","","Build this space to get your last Shrine. Yep, definitely the last one. No need to look for a 10th shrine anywhere... yet...","Построй это место, чтобы получить последнее святилище. Ага, точно последнее. 10-е святилище искать не надо... пока..."],[69,"","","Builder Bird",null],[69,"","","Dog Bone",null],[69,"","","Giftmas Blobulyte",null],[69,"","","Grasslands Gary",null],[69,"","","Mr Pigibank",null],[69,"","","Papua Piggea",null],[69,"","","Picnic Stowaway",null],[69,"","","Tiki Chief",null],[69,"","","Town Marble",null],[69,"","","TP Pete",null],[69,"","","Falloween Pumpkin",null],[69,"","","Bandit Bob",null],[69,"","","Constructor Crow",null],[69,"","","Cowbo Jones",null],[69,"","","Desert Davey",null],[69,"","","Obol Altar",null],[69,"","","Omar Da Ogar",null],[69,"","","Postboy Pablob",null],[69,"","","Snake Jar",null],[69,"","","XxX Cattleprod XxX",null],[69,"","","Gangster Gus",null],[69,"","","Bill Brr",null],[69,"","","Carpenter Cardinal",null],[69,"","","Iceland Irwin",null],[69,"","","Lonely Hunter",null],[69,"","","Lord of the Hunt",null],[69,"","","Key1 x1.png",null],[69,"","","Key2 x1.png",null],[69,"","","Key3 x1.png",null],[69,"","","Key4 x1.png",null],[69,"","","TixCol x1.png",null],[69,"","","rtt0 x1.png",null],[69,"","","ObolFrag x1.png",null],[69,"","","PremiumGem x1.png",null],[69,"","","Quest89 x1.png",null],[69,"","","Key5 x1.png",null],[69,"","","Capital P",null],[69,"","","Nebula Neddy",null],[69,"","","Rift Ripper",null],[69,"","","Royal Worm",null],[69,"","","The Cape Vine v1.25",null],[69,"","","薪\n*The Cape Vine and its custodian Catherine have arrived in World 4!\n*You can deposit your capes here to make their bonuses account wide! Because capes no longer give stats when equipped, you can wear whatever cape looks nicest!\n*You can take out as many capes as you want, whenever you want. This means you can equip the same cape on all characters!\n*Capes only give 20% of their full bonuses, unless you put them in a Golden Vine slot where they give their full bonuses. You get one of these instantly, and can unlock more by Asking Catherine for help using the Ask Cathie button in the topleft of The Cape Vine!\n*Research Skill Mastery added to the Rift! Earn 7 unique research related bonuses as you level up your account's Research LV to 1000! Since Research LV is shared across all characters, you basically just need to get to Lv 91 given you have 11 characters.\n\n\n蔓\n*Improved Cavern 10 display, increasing the max visual display of Temple Torches you own by one billion times.\n*The new Cape Vine in World 4 is itself huge quality, removing the need to micromanage your capes and letting you style up your characters to the max!\n\n蓬\n*Adjusted the 'Expanded Barracks' upgrade within Royal Guardian Outposts, so that it gives a new unit up to Lv 6 instead of 5. This also retroactively fixes a bug regarding this, that way nobody ends up ahead.\n\n蔬\n*Royal Guardian's Pit O' Pages talent, which boosts Spelunking Efficiency and Speed for finding more pages, has been fixed and now correctly applies to all characters.\n*Fixed the Legend Talent 'Yet Another Printer Multi' which wasn't giving its full bonus.\n*Added the 2hr Funny Feather and Funny Slice items to The Slab. Previously, only Poppy's Funny Fish was there.\n*Fixed Killroy's masterclass drops bonus, which wasn't giving its full bonus.\n*Fixed the Clamworks display for Worker's Comp for real this time.\n*Fixed several Farming Land Rank EXP bonuses that were not giving their full bonuses, namely some from the Exotic Market.\n*Fixed an issue where each Eclectic Sigil wasn't giving the proper Damage bonus based on Research Grid H6.",null],[69,"","","*Le Monde 6 est arrivé, avec tout ce que vous pourriez souhaiter ! De nouveaux monstres, de nouvelles compétences, de nouvelles cartes, de nouveaux tampons, de nouvelles bulles, de nouvelles fioles, de nouvelles statues, de nouveaux équipements, tellement de nouveautés !\n*Vous pouvez découvrir le Monde 6 vous-même, à la place, ces notes de mise à jour concernent tous les changements de cette mise à jour non liés au Monde 6.\n*Nouvel affichage des pièces ajouté ! Collectez 100 pièces Godshard pour voir ce que je veux dire !\n*Le succès Trial by Time peut désormais être complété à n'importe quelle vitesse de déplacement.\n*Mise à l'échelle du bonus ajustée sur la 6ème bulle de chaque couleur. C'est un buff pour toute personne en dessous du niveau de bulle 300, sinon c'est un nerf.\n* Correction du problème où les archers glissaient lorsqu'ils essayaient de combattre des foules protégées.\n*Les attaques au canon de Siege Breaker apparaissent désormais derrière lui.",null],[69,"","","*Welt 6 ist da, mit allem, was Sie sich nur wünschen können! Neue Monster, neue Fähigkeiten, neue Karten, neue Stempel, neue Blasen, neue Fläschchen, neue Statuen, neue Ausrüstung, so viel neues Zeug!\n*Sie können Welt 6 selbst entdecken. Stattdessen gelten diese Patchnotizen für alle Änderungen in diesem Update, die nicht mit Welt 6 zusammenhängen.\n*Neue Münzanzeige hinzugefügt! Sammle 100 Godshard-Münzen, um zu sehen, was ich meine!\n*Die Errungenschaft „Prüfung durch Zeit“ kann jetzt bei jeder Bewegungsgeschwindigkeit abgeschlossen werden.\n*Bonusskalierung für die 6. Blase jeder Farbe angepasst. Es ist ein Buff für alle unter Bubble Lv 300, andernfalls ist es ein Nerf.\n*Das Problem wurde behoben, bei dem Bogenschützen herumrutschten, wenn sie versuchten, gegen abgeschirmte Mobs zu kämpfen.\n*Die Kanonenangriffe von Belagerungsbrecher erscheinen jetzt hinter ihm.",null],[69,"","","*원하는 모든 것을 갖춘 월드 6이 도착했습니다! 새로운 몬스터, 새로운 기술, 새로운 지도, 새로운 우표, 새로운 거품, 새로운 약병, 새로운 조각상, 새로운 장비, 너무나 많은 새로운 것들!\n*월드 6를 직접 발견하실 수 있습니다. 대신 이 패치 노트는 월드 6과 관련되지 않은 이번 업데이트의 모든 변경 사항에 대한 것입니다.\n*새로운 코인 표시가 추가되었습니다! 100개의 갓샤드 동전을 모아 무슨 뜻인지 알아보세요!\n*이제 모든 이동 속도에서 시간별 시험 업적을 완료할 수 있습니다.\n*각 색상의 6번째 버블에 대한 보너스 스케일링을 조정했습니다. 버블 Lv 300 미만인 사람에게는 버프이고, 그렇지 않으면 너프입니다.\n*방어막이 있는 몹과 싸울 때 궁수가 미끄러지는 문제를 수정했습니다.\n*Siege Breaker의 대포 공격이 이제 그의 뒤에서 생성됩니다.",null],[69,"","","*あなたが望むすべてが揃ったワールド 6 が到着しました!新しいモンスター、新しいスキル、新しいマップ、新しいスタンプ、新しいバブル、新しい小瓶、新しい彫像、新しい装備など、新しいものがたくさんあります。\n*ワールド 6 はご自身で発見することができます。代わりに、これらのパッチノートは、ワールド 6 に関係しないこのアップデートのすべての変更を対象としています。\n*新しいコインの表示が追加されました。 Godshard コインを 100 枚集めて、私の言っている意味を確認してください。\n*Trial by Time アチーブメントは任意の移動速度で完了できるようになりました。\n*各色の 6 番目のバブルのボーナス スケーリングを調整しました。バブルLv 300以下の人にとってはバフですが、そうでない場合はナーフです。\n*射手がシールドされたMobと戦おうとすると滑り回る問題を修正しました。\n*Siege Breaker の大砲攻撃が彼の背後に出現するようになりました。",null],[69,"","","*世界 6 已经到来，拥有您想要的一切！新怪物、新技能、新地图、新印章、新泡泡、新瓶子、新雕像、新装备，这么多新东西！\n*您可以自己发现世界 6，相反，这些补丁说明适用于本次更新中与世界 6 无关的所有更改。\n*添加了新硬币显示！收集 100 个神碎片硬币就明白我的意思了！\n*时间审判成就现在可以以任何移动速度完成。\n*调整了每种颜色的第六个气泡的奖金比例。对于 300 级以下的泡泡来说是一个 buff，否则就是 nerf。\n*修复了弓箭手在试图对抗屏蔽小怪时会滑动的问题。\n*攻城者的大炮攻击现在在他身后产生。",null],[69,"","","BLOOD BERSERKER","КРОВАВЫЙ БЕРСЕРК"],[69,"","","DEATH BRINGER","ВЕСТНИК СМЕРТИ"],[69,"","","DIVINE KNIGHT","БОЖЕСТВЕННЫЙ РЫЦАРЬ"],[69,"","","ROYAL GUARDIAN","КОРОЛЕВСКИЙ СТРАЖ"],[69,"","","SIEGE BREAKER","СОКРУШИТЕЛЬ ОСАД"],[69,"","","WIND WALKER","СТРАННИК ВЕТРА"],[69,"","","BEAST MASTER","ПОВЕЛИТЕЛЬ ЗВЕРЕЙ"],[69,"","","ELEMENTAL SORCERER","ПОВЕЛИТЕЛЬ СТИХИЙ"],[69,"","","SPIRITUAL MONK","ДУХО ,"При сборе x7 ₣ и ещё x3 опыта гейминга."],[69,"","","Gives up to 100x more ₣ when picked, but the exact multiplier is random. It could be as low as just 1x ₣.","При сборе до x100 ₣, но точный множитель случаен. Может выпасть и всего x1 ₣."],[69,"","","Moves everything in garden ahead in time when picked. This includes import item cooldowns and growing all plants.","При сборе перематывает время всего сада вперёд. Включая перезарядку импорта и рост всех растений."],[69,"","","Has a chance of recovering one of King Rat's 100 missing crowns. You can't get duplicate crowns, just so you know...","Есть шанс вернуть одну из 100 пропавших корон Крысиного короля. Повторов не бывает, просто чтоб ты знал..."],[69,"","","Little Sprinkler","Маленькая поливалка"],[69,"","","Dirty Shovel","Грязная лопата"],[69,"","","Autumn Squirrel","Осенняя белка"],[69,"","","Elegant Seashell","Изящная ракушка"],[69,"","","Kitsune Roxie","Кицунэ Рокси"],[69,"","","Bog Log","Болотное бревно"],[69,"","","POiNG Controller","Контроллер POiNG"],[69,"","","Immortal Snail","Бессмертная улитка"],[69,"","","King Rat of Olde","Древний Крысиный король"],[69,"","","A small metal sprinkler, and a trusty ally to have in the garden. It's heart is in the right place, but it won't do much if your garden has no space.","Маленькая металлическая поливалка, верный союзник в саду. Сердце у неё доброе, но толку мало, если в саду нет места."],[69,"","","It may be rusty and old, but this reliable tool can find pure gold! With rumors of a million multiplier nugget, this is sure to come in handy!","Пусть ржавая и старая, но этот надёжный инструмент находит чистое золото! Ходят слухи о самородке с множителем в миллион, так что точно пригодится!"],[69,"","","Everyones favorite garden rodent, other than the King Rat of Olde. This furry fella just cant help but gather all the nuts it can find!","Всеми любимый садовый грызун, не считая Древнего Крысиного короля. Этот пушистик просто не может не собрать все орехи, что найдёт!"],[69,"","","The seashell emits a soothing ocean noise. The good vibes stop once you realize that ninja tsunamis will use this as a distraction to sneak up on you.","Ракушка издаёт успокаивающий шум океана. Хорошее настроение кончается, когда понимаешь, что цунами-ниндзя под этот шум к тебе подкрадутся."],[69,"","","Totally kawaii, totally enjoys sleeping! IMPORTANT: Kitsune Rock cannot be toggled while plants are unpicked.","Сплошное каваи, обожает спать! ВАЖНО: камень кицунэ нельзя переключить, пока растения не собраны."],[69,"","","Underneath each log lies either a star, which will give you instant garden growth, or death, which will end your career as a log flipper.","Под каждым бревном либо звезда, дающая мгновенный рост сада, либо смерть, которая закончит твою карьеру переворачивателя брёвен."],[69,"","","Retro technology capable of moving a rectangle into the direct path of a circle, in the hopes that the opposing rectangle wont do it as well.","Ретротехнология, способная подвинуть прямоугольник на пути круга в надежде, что вражеский прямоугольник так не сможет."],[69,"","","This snail will slowly drive you crazy. With each Lv, the snail grows stronger, and thanks to the Snail Sprout Treaty of 1951, your garden does too.","Эта улитка медленно сведёт тебя с ума. С каждым уровнем она сильнее, и по Улиточно-ростковому договору 1951 года твой сад тоже."],[69,"","","He used to rule the garden... IMPORTANT INFO: Higher evolved Royale Sprouts have higher chances of finding new Crowns!","Когда-то он правил садом... ВАЖНО: чем выше эволюция королевских ростков, тем выше шанс найти новые короны!"],[69,"","","Instantly grows sprouts when activated. Recharges over time.","При активации мгновенно выращивает ростки. Перезаряжается со временем."],[69,"","","Digs up gold nuggets when activated. Only the biggest nugget found affects ₣ multi","При активации выкапывает золотые самородки. На множитель ₣ влияет только самый крупный"],[69,"","","Gives all acorns it has found since     found: n => n + " bonuses", systems: n => "in " + n + " systems",
    open: "Expand all", close: "Collapse all", alt: "Show the other language",
    none: "Nothing found.", short: "Type at least 3 letters.",
    searchTitle: q => "Search: “" + q + "”",
    foot: "All names and texts are read from the game code; # marks the number the game fills in (it depends on the level). Russian texts are from the IdleOn Russian translation.",
    build: b => "Game build " + b + ".",
  },
  ru: {
    title: "IdleOn: поиск бонусов", subtitle: "все места в игре, где можно поднять стат",
    search: "Поиск по тексту бонуса, например «ширина линии» или «кухня»",
    pick: "Выберите стат слева или введите текст в поиск.",
    found: n => n + " " + plural(n, "бонус", "бонуса", "бонусов"), systems: n => "в " + n + " " + plural(n, "системе", "системах", "системах"),
    open: "Развернуть все", close: "Свернуть все", alt: "Показывать текст на другом языке",
    none: "Ничего не найдено.", short: "Введите хотя бы 3 буквы.",
    searchTitle: q => "Поиск: «" + q + "»",
    foot: "Все названия и тексты взяты из кода игры; # — число, которое игра подставляет (зависит от уровня). Русские тексты — из русификатора IdleOn.",
    build: b => "Сборка игры " + b + ".",
  },
};
function plural(n, one, few, many){ const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let lang = store.get("sf-lang") || ((navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]).some(l => /^ru\b/i.test(l)) ? "ru" : "en");
let L = T[lang];
let stat = store.get("sf-stat") || "";
let query = "";
let showAlt = store.get("sf-alt") === "1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATS = {};
D.cats.forEach(c => c.stats.forEach(s => STATS[s.id] = s));
// texts keep the game's placeholders: { } $ ^ ~ are numbers the game fills in
const fmt = (s, hl) => {
  let h = esc(s);
  if (hl) h = h.replace(hl, m => "<mark>" + m + "</mark>");
  return h.replace(/[{}$^~]/g, '<i class="n">#</i>');
};
const name = x => lang === "ru" ? (x[2] || x[1]) : x[1];
const text = x => lang === "ru" ? (x[4] || x[3]) : x[3];
const other = x => lang === "ru" ? (x[4] ? x[3] : "") : (x[4] || "");

function renderCats(){
  $("#cats").innerHTML = D.cats.map(c => `<div class="cat"><h3>${esc(c[lang])}</h3><div class="chips">${
    c.stats.map(s => `<button type="button" class="chip" data-stat="${s.id}" aria-pressed="${s.id === stat && !query}">${esc(s[lang])}<b>${s.hits.length}</b></button>`).join("")
  }</div></div>`).join("");
}

function renderOut(){
  let hits, title, hl = null;
  if (query) {
    if (query.length < 3) { $("#out").innerHTML = `<p class="empty">${L.short}</p>`; return; }
    const q = query.toLowerCase();
    hits = D.src.map((x, i) => i).filter(i => { const x = D.src[i]; return (x[3] + "\n" + (x[4] || "") + "\n" + x[1] + "\n" + (x[2] || "")).toLowerCase().includes(q); });
    title = L.searchTitle(query);
    hl = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  } else if (STATS[stat]) {
    hits = STATS[stat].hits; title = STATS[stat][lang];
  } else { $("#out").innerHTML = `<p class="empty">${L.pick}</p>`; return; }
  const by = new Map();
  hits.forEach(i => { const s = D.src[i][0]; if (!by.has(s)) by.set(s, []); by.get(s).push(D.src[i]); });
  const order = [...by.keys()].sort((a, b) => by.get(b).length - by.get(a).length || a - b);
  const many = hits.length > 60;   // long lists start collapsed to their system headers
  $("#out").innerHTML = `<div class="res-head"><h2>${esc(title)}</h2><span class="n">${L.found(hits.length)} ${L.systems(order.length)}</span></div>
    <div class="tools"><button type="button" id="openAll">${L.open}</button><button type="button" id="closeAll">${L.close}</button>
    <label><input type="checkbox" id="alt"${showAlt ? " checked" : ""}> ${L.alt}</label></div>` +
    (hits.length ? order.map(s => `<details class="sys"${many ? "" : " open"}><summary>${esc(D.systems[s][lang])} <span class="c">${by.get(s).length}</span></summary><div class="rows">${
      by.get(s).map(x => `<div class="row"><div class="nm">${fmt(name(x), hl)}</div><div><div class="tx">${fmt(text(x), hl)}</div>${showAlt && other(x) ? `<div class="alt">${fmt(other(x), hl)}</div>` : ""}</div></div>`).join("")
    }</div></details>`).join("") : `<p class="empty">${L.none}</p>`);
}

function applyLang(){
  L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = L[e.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#q").placeholder = L.search;
  $("#build").textContent = D.build ? L.build(D.build) : "";
  renderCats(); renderOut();
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("sf-lang", lang); applyLang(); });
$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-stat]"); if (!b) return;
  stat = b.dataset.stat; query = ""; $("#q").value = ""; store.set("sf-stat", stat);
  history.replaceState(null, "", "#" + stat);
  renderCats(); renderOut();
});
let tmr;
$("#q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { query = e.target.value.trim(); renderCats(); renderOut(); }, 150); });
$("#out").addEventListener("click", e => {
  if (e.target.id === "openAll" || e.target.id === "closeAll") document.querySelectorAll("details.sys").forEach(d => d.open = e.target.id === "openAll");
});
$("#out").addEventListener("change", e => { if (e.target.id === "alt") { showAlt = e.target.checked; store.set("sf-alt", showAlt ? "1" : "0"); renderOut(); } });
const fromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); if (STATS[h]) { stat = h; query = ""; $("#q").value = ""; } };
window.addEventListener("hashchange", () => { fromHash(); renderCats(); renderOut(); });
fromHash();
applyLang();
</script>
</body>
</html>
