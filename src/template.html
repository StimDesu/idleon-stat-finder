<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IdleOn Stat Finder</title>
<meta name="description" content="Legends of Idleon: pick a stat (drop rate, cooking speed, lab line width...) and see every bonus in the game that raises it, with your current values from the save.">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#f7f8fb; --ink:#1b1f33; --muted:#666c86; --line:#dcdfea;
  --gold:#b98200; --gold-bg:#fff1c7; --blue:#2f63c8; --blue-bg:#dfe8fb; --ok:#1f8a55; --bad:#c4391a;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --blue:#8fb2ff; --blue-bg:#1b2648; --ok:#5fd394; --bad:#ff8a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --blue:#8fb2ff; --blue-bg:#1b2648; --ok:#5fd394; --bad:#ff8a6b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em}
h1 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.02em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:6px 12px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border:0;border-radius:0;padding:4px 10px;font:600 12px var(--mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.row-in{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
#nick{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);min-width:0;width:220px;max-width:100%}
#save{width:100%;height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font:12px var(--mono);resize:vertical}
.or{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{font-size:13px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:820px){.side{position:static;max-height:none}}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.cat h3{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:3px 10px;font:500 13px var(--body);display:inline-flex;gap:6px;align-items:baseline}
.chip b{font:600 11px var(--mono);color:var(--muted)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.chip[aria-pressed="true"] b{color:var(--blue)}
.res-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.res-head .n{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px}
.tools .lnk{font:500 13px var(--body);background:none;border:0;color:var(--blue);padding:0}
.totals{display:flex;flex-wrap:wrap;gap:8px}
.tot{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 12px;display:grid}
.tot b{font:600 18px var(--mono)}
.tot span{font-size:12px;color:var(--muted)}
details.sys{border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
details.sys>summary{cursor:pointer;padding:8px 12px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;list-style:none}
details.sys>summary::-webkit-details-marker{display:none}
details.sys>summary::before{content:"▸";color:var(--muted);width:10px}
details.sys[open]>summary::before{content:"▾"}
details.sys>summary .c{font:600 12px var(--mono);color:var(--muted)}
details.sys>summary .sv{margin-left:auto;font:600 12px var(--mono);color:var(--ok)}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(110px,220px) minmax(0,1fr) 64px 92px;gap:4px 12px;padding:6px 12px;border-top:1px solid var(--line);align-items:baseline}
.rows.nosave .row{grid-template-columns:minmax(110px,240px) minmax(0,1fr)}
.row:first-child{border-top:0}
.row.off{color:var(--muted)}
.row.off .nm{font-weight:500}
@media (max-width:640px){.row,.rows.nosave .row{grid-template-columns:minmax(0,1fr) auto}.row .nm{grid-column:1;grid-row:1}.row .val{grid-column:2;grid-row:1}.row .txw{grid-column:1/-1;grid-row:2}.row .lv{display:none}}
.row .nm{font-weight:600}
.row .tx{white-space:pre-line;overflow-wrap:anywhere}
.row .alt{color:var(--muted);font-size:12px;white-space:pre-line}
.row .lv{font:12px var(--mono);color:var(--muted);text-align:right}
.row .val{font:600 13px var(--mono);text-align:right;white-space:nowrap}
.row.off .val{font-weight:400}
.row .val small{display:block;font:11px var(--body);color:var(--muted);white-space:normal}
i.n{font-style:normal;font:600 12px var(--mono);color:var(--gold);background:var(--gold-bg);border-radius:3px;padding:0 3px}
i.v{font-style:normal;font:600 12px var(--mono);color:var(--ok)}
mark{background:var(--gold-bg);color:inherit;border-radius:2px}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:12px}
footer{color:var(--muted);font-size:12px}
.formula{background:var(--panel2)}
.ftot{font:600 22px var(--mono);color:var(--ok)}
.fg{display:grid;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.fgh{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.fgh b{font:600 13px var(--mono);color:var(--ink);text-transform:none}
.ft{display:flex;justify-content:space-between;gap:12px;padding:4px 10px;border-top:1px solid var(--line)}
.ft:first-of-type{border-top:0}
.ft b{font:600 13px var(--mono);white-space:nowrap}
.ft.off{color:var(--muted)}.ft.off b{font-weight:400}
.ft.nc{color:var(--muted);font-style:italic}.ft.nc b{font:italic 12px var(--body)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-i="title"></span> <small data-i="subtitle"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
    </div>
  </header>

  <div class="card">
    <form class="row-in" id="nickForm">
      <input id="nick" type="text" autocomplete="username" spellcheck="false" aria-labelledby="nickBtn">
      <button id="nickBtn" class="btn" type="submit" data-i="nick_btn"></button>
      <span class="hint" data-i="nick_hint"></span>
    </form>
    <div class="or" data-i="or"></div>
    <textarea id="save" spellcheck="false" aria-label="Save JSON"></textarea>
    <div class="row-in">
      <button id="go" class="btn" type="button" data-i="parse"></button>
      <label class="btn ghost file"><span data-i="open"></span><input id="file" type="file" accept=".json,.txt,application/json,text/plain"></label>
      <button id="forget" type="button" class="btn ghost" data-i="forget"></button>
      <span id="msg" class="msg" role="status"></span>
    </div>
  </div>

  <div class="layout">
    <aside class="card side">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <div id="cats"></div>
    </aside>
    <main class="card" id="out" aria-live="polite"></main>
  </div>

  <footer><span data-i="foot"></span> <span id="build"></span></footer>
</div>

<script>
const D = __DATA__;
const T = {
  en: {
    title: "IdleOn Stat Finder", subtitle: "every place in the game that raises a stat",
    nick_btn: "Load by username", nick_hint: "Your profile published on idleonefficiency.com. Publish it there again to refresh.",
    or: "or paste the raw JSON of your save", parse: "Load", open: "Open file…", forget: "Forget save",
    ok: "Save loaded.", ok_nick: a => `Loaded ${a.name}` + (a.when ? ` (published ${a.when}).` : "."), nick_loading: n => `Loading ${n}…`, ok_saved: "Last save loaded.", forgot: "Save forgotten.",
    e_nokey: "This is not an IdleOn save (no character data).", e_nick: a => `No profile for ${a.name} (HTTP ${a.status}). Publish it on idleonefficiency.com first.`, e_nickfail: a => `Could not load ${a.name}: ${a.err}`,
    search: "Search any bonus text, e.g. 'line width' or 'kitchen'",
    pick: "Pick a stat on the left, or type in the search box.",
    found: n => n + " bonuses", systems: n => "in " + n + " systems",
    open_all: "Expand all", close_all: "Collapse all", alt: "Show the other language", only_on: "Only bonuses that work now",
    char: "Character", none: "Nothing found.", short: "Type at least 3 letters.",
    searchTitle: q => "Search: “" + q + "”",
    t_pct: "sum of +% bonuses", t_flat: "sum of flat + bonuses", t_mult: "product of × bonuses", t_count: (a, b) => `${a} of ${b} bonuses work now`,
    tot_note: "Sums of what the save shows for each source, at base values. The game combines a stat with its own formula (some bonuses add, some multiply, many have extra multipliers or conditions), so the real in-game number can differ. Grey rows: not unlocked, not equipped, or level 0.",
    nosave: "Load your save to see your current value of every bonus.",
    unread: "not read from save", lvl: "lv", eq_not: "not equipped", eq_yes: "equipped", map: "on its map",
    cur_char: "this character", fixed: "unlocked",
    f_title: "Game formula", f_char: n => "for " + n, f_nc: "not counted",
    f_note: n => `The game's own formula for this stat, term by term, from your save. ${n} terms are not counted yet (their systems are not ported, or the save does not hold them), so the in-game number can be higher. The rows below list every source of the stat.`,
    foot: "All names, texts and base formulas are read from the game code; # marks the number the game fills in. Russian texts are from the IdleOn Russian translation.",
    build: b => "Game build " + b + ".",
  },
  ru: {
    title: "IdleOn: поиск бонусов", subtitle: "все места в игре, где можно поднять стат",
    nick_btn: "Загрузить по нику", nick_hint: "Берётся профиль, опубликованный на idleonefficiency.com. Чтобы обновить данные, опубликуйте профиль там заново.",
    or: "или вставьте raw JSON сохранения", parse: "Загрузить", open: "Открыть файл…", forget: "Забыть сохранение",
    ok: "Сохранение загружено.", ok_nick: a => `Загружен ${a.name}` + (a.when ? ` (опубликован ${a.when}).` : "."), nick_loading: n => `Загружаю ${n}…`, ok_saved: "Загружено прошлое сохранение.", forgot: "Сохранение забыто.",
    e_nokey: "Это не сохранение IdleOn (нет данных персонажей).", e_nick: a => `Профиль ${a.name} не найден (HTTP ${a.status}). Сначала опубликуйте его на idleonefficiency.com.`, e_nickfail: a => `Не удалось загрузить ${a.name}: ${a.err}`,
    search: "Поиск по тексту бонуса, например «ширина линии» или «кухня»",
    pick: "Выберите стат слева или введите текст в поиск.",
    found: n => n + " " + plural(n, "бонус", "бонуса", "бонусов"), systems: n => "в " + n + " " + plural(n, "системе", "системах", "системах"),
    open_all: "Развернуть все", close_all: "Свернуть все", alt: "Показывать текст на другом языке", only_on: "Только работающие сейчас",
    char: "Персонаж", none: "Ничего не найдено.", short: "Введите хотя бы 3 буквы.",
    searchTitle: q => "Поиск: «" + q + "»",
    t_pct: "сумма бонусов +%", t_flat: "сумма бонусов +N", t_mult: "произведение бонусов ×", t_count: (a, b) => `работают ${a} из ${b}`,
    tot_note: "Это суммы значений из сохранения по каждому источнику, в базовом виде. Игра собирает стат своей формулой (часть бонусов складывается, часть умножается, у многих есть свои множители и условия), поэтому число в игре может отличаться. Серые строки — не открыто, не надето или уровень 0.",
    nosave: "Загрузите сохранение, чтобы видеть текущее значение каждого бонуса.",
    unread: "не читается из сохранения", lvl: "ур.", eq_not: "не надето", eq_yes: "надето", map: "на своей карте",
    cur_char: "этот персонаж", fixed: "открыто",
    f_title: "Формула игры", f_char: n => "для " + n, f_nc: "не считается",
    f_note: n => `Это собственная формула игры для этого стата, по слагаемым, из вашего сохранения. Не учтено слагаемых: ${n} (их системы ещё не перенесены или их нет в сохранении), поэтому в игре число может быть больше. Ниже — список всех источников стата.`,
    foot: "Все названия, тексты и базовые формулы взяты из кода игры; # — число, которое игра подставляет. Русские тексты — из русификатора IdleOn.",
    build: b => "Сборка игры " + b + ".",
  },
};
function plural(n, one, few, many){ const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let lang = store.get("sf-lang") || ((navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]).some(l => /^ru\b/i.test(l)) ? "ru" : "en");
let L = T[lang];
let stat = store.get("sf-stat") || "";
let query = "";
let showAlt = store.get("sf-alt") === "1";
let onlyOn = store.get("sf-on") === "1";
let acct = null, charN = Number(store.get("sf-char")) || 0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const loc = () => lang === "ru" ? "ru-RU" : "en-US";
const STATS = {};
D.cats.forEach(c => c.stats.forEach(s => STATS[s.id] = s));

// ---------- save ----------
const asArr = v => { if (typeof v !== "string") return v; try { return JSON.parse(v); } catch (e) { return v; } };
const at = (a, i) => { if (a == null) return 0; const v = Array.isArray(a) ? a[i] : a[i] != null ? a[i] : a[String(i)]; return Number(v) || 0; };
const list = a => a == null ? [] : Array.isArray(a) ? a : Object.keys(a).filter(k => /^\d+$/.test(k)).sort((x, y) => x - y).map(k => a[k]);
function parseSave(text){
  let o = JSON.parse(text.trim());
  if (o && o.data && typeof o.data === "object" && !("Lv0_0" in o)) o = o.data;
  if (!o || !("Lv0_0" in o)) throw new Error("nokey");
  const A = k => o[k] == null ? null : asArr(o[k]);
  const names = asArr(o.playerNames) || [], lab = list(A("Lab")).map(asArr);
  const chars = [];
  for (let n = 0; ("Lv0_" + n) in o; n++) {
    const eq = list(A("EquipOrder_" + n)).map(list);
    chars.push({
      n, name: names[n] || "#" + (n + 1), sl: A("SL_" + n) || {},
      sign: String(o["PVtStarSign_" + n] || "").split(",").filter(x => x !== "" && x !== "_"),
      cards: list(A("CardEquip_" + n)).map(String), statue: list(A("StatueLevels_" + n)).map(list),
      prayers: list(A("Prayers_" + n)).map(Number), chips: list(lab[1 + n]).map(Number),
      bubbles: list(A("CauldronBubbles")).map(list)[n] || [],
      // worn things: [item ids, upgrade maps]
      worn: [[eq[0] || [], A("EMm0_" + n) || {}], [eq[1] || [], A("EMm1_" + n) || {}], [list(A("ObolEqO0_" + n)), A("ObolEqMAP_" + n) || {}]],
    });
  }
  return { A, chars, family: [list(A("ObolEqO1")), A("ObolEqMAPz1") || {}], cards0: A("Cards0") || {} };
}
function setAccount(a){
  acct = a;
  if (acct && !acct.chars[charN]) charN = 0;
  renderOut();
}

// ---------- the current value of one bonus (base formulas from the game code) ----------
function f5(type, x1, x2, n){   // ArbitraryCode5Inputs
  switch (type) {
    case "add": return x2 !== 0 ? ((x1 + x2) / x2 + .5 * (n - 1)) / (x1 / x2) * n * x1 : x1 * n;
    case "decay": return x1 * n / (n + x2);
    case "decayMulti": return 1 + x1 * n / (n + x2);
    case "bigBase": return x1 + x2 * n;
    case "intervalAdd": return x1 + Math.floor(n / x2);
    case "reduce": return x1 - x2 * n;
    default: return 0;
  }
}
function cardLv(id, req){   // "CardLv": 1 star per threshold req*(s+1+s/3+16(s/4)+100(s/5))^2
  const kills = Number(acct.cards0[id]) || 0;
  if (kills <= 0) return 0;
  const stars = 4 + (at(acct.A("Rift"), 0) >= 45 ? 1 : 0) + (at(list(acct.A("Spelunk"))[0], 2) >= 1 ? 1 : 0);
  let lv = 1;
  for (let s = 0; s < stars; s++) if (kills > req * Math.pow(s + 1 + Math.floor(s / 3) + 16 * Math.floor(s / 4) + 100 * Math.floor(s / 5), 2)) lv = s + 2;
  return lv;
}
const fixedNum = t => { const m = String(t).match(/\d+(\.\d+)?/); return m ? Number(m[0]) : 0; };
// where an item is worn: [slot, upgrade map] or null
function worn(ch, item){
  for (const [ids, ups] of [...ch.worn, acct.family]) {
    const i = ids.indexOf(item);
    if (i >= 0) return asArr(ups[i] != null ? ups[i] : ups[String(i)]) || {};
  }
  return null;
}
// returns {lv, v, v2, on, note} or null when the system is not read from the save
function value(x){
  const c = x[5]; if (!c || !acct) return null;
  const A = acct.A, ch = acct.chars[charN];
  switch (c[0]) {
    case "tal": { const lv = Number(ch.sl[c[1]]) || 0; return { lv, v: f5(c[2], c[3], c[4], lv), v2: c[5] !== "txt" ? f5(c[5], c[6], c[7], lv) : null, on: lv > 0, who: 1 }; }
    case "bub": {
      const lv = at(list(A("CauldronInfo"))[c[1]], c[2]); let on = lv > 0, note = "";
      if (c[6]) { on = on && ch.bubbles.includes("abcd"[c[1]] + c[2]); note = on ? L.eq_yes : L.eq_not; }
      return { lv, v: f5(c[3], c[4], c[5], lv), on, note, who: c[6] };
    }
    case "vial": { const lv = at(list(A("CauldronInfo"))[4], c[1]); return { lv, v: f5(c[2], c[3], c[4], lv), on: lv > 0 }; }
    case "stamp": { const lv = at(list(A("StampLv"))[c[1]], c[2]); return { lv, v: f5(c[3], c[4], c[5], lv), on: lv > 0 }; }
    case "card": {
      const lv = cardLv(c[1], c[2]), eq = ch.cards.includes(c[1]);

    mults = [["Mining level / 200", "Уровень добычи / 200", 1 + lv / 200], ["STR curve", "Кривая силы", 1 + Math.pow(s / 100, .35) * t142],
      ["Talent 85 + gear", "Талант 85 + снаряжение", 1 + (T(1, 85) + M.etc("10")) / 100], ["Cards, star signs, vials", "Карты, знаки, флаконы", 1 + (M.card(24) + M.sign("MiningEff") + M.vial("MinEff")) / 100],
      ["Tool power %", "Сила инструмента %", 1 + tool / 100], ["Bubble MinEff", "Пузырь MinEff", 1 + (M.bubble("MinEff") || 0) / 100],
      ["Talent 101 × (atom + log copper)", "Талант 101 × (атом + log меди)", 1 + T(1, 101) * (atomBonus(1) + getLOG(ownedItem("Copper"))) / 100]];
  } else if (sk === "Choppin") {
    const w = st("WIS"), a = 1 + T(1, 462) / 100, b = 1 + T(1, 532) / 100;
    base = [["Base", "База", 8], ["Tool power^1.3", "Сила инструмента^1.3", Math.pow(tool, 1.3)], [`WIS (${num(w)})^0.6`, `Мудрость (${num(w)})^0.6`, Math.pow((w + 2) * a * b, .6)], ["Stamps", "Штампы", M.stamp("BaseChopEff")], ["All skills base", "База всех навыков", allBase]];
    mults = [["Choppin level / 200", "Уровень рубки / 200", 1 + lv / 200], ["Star signs", "Знаки зодиака", 1 + M.sign("ChopEff") / 100], ["Bubble ChopEff", "Пузырь ChopEff", 1 + (M.bubble("ChopEff") || 0) / 100],
      ["WIS curve", "Кривая мудрости", 1 + Math.pow(w * a / 100, .35) * b], ["Talent 445 + gear", "Талант 445 + снаряжение", 1 + (T(1, 445) + M.etc("11")) / 100],
      ["Cards, vials, achievement 352", "Карты, флаконы, достижение 352", 1 + (M.card(27) + M.vial("ChopEff") + 10 * M.ach(352)) / 100], ["Tool power %", "Сила инструмента %", 1 + tool / 100],
      ["Talent 461 × log leaves", "Талант 461 × log листьев", 1 + T(1, 461) * getLOG(ownedItem("Leaf1")) / 100]];
  } else if (sk === "Fishing") {
    const s = st("STR"), t142 = 1 + T(1, 142) / 100;
    base = [["Tool power^1.3", "Сила инструмента^1.3", Math.pow(tool, 1.3)], [`STR (${num(s)})^0.6`, `Сила (${num(s)})^0.6`, Math.pow(s, .6) * t142], ["Stamps", "Штампы", M.stamp("BaseFishEff")], ["All skills base", "База всех навыков", allBase]];
    mults = [["Fishing level / 200", "Уровень рыбалки / 200", 1 + lv / 200],
      ["STR curve (talent 142, bribe 29, stamp per level)", "Кривая силы (талант 142, взятка 29, штамп за уровень)", 1 + Math.pow(s / 100, .35) * (1 + (T(1, 142) + 15 * M.bribe(29) + M.stamp("FishEffPerLv") * lv) / 100)],
      ["Tool power %", "Сила инструмента %", 1 + tool / 100], ["Cards, vials, gear", "Карты, флаконы, снаряжение", 1 + (M.card(30) + M.vial("FishEff") + M.etc("19")) / 100],
      ["Talent 85", "Талант 85", 1 + T(1, 85) / 100], ["Star signs", "Знаки зодиака", 1 + M.sign("FishEff") / 100]];
  } else {
    const a = st("AGI"), t = 1 + T(1, 296) / 100, t2 = 1 + T(1, 367) / 100;
    base = [["Tool power^1.3", "Сила инструмента^1.3", Math.pow(tool, 1.3)], [`AGI (${num(a)})^0.6`, `Ловкость (${num(a)})^0.6`, Math.pow(a * t, .6) * t2], ["Stamps", "Штампы", M.stamp("BaseCatchEff")], ["All skills base", "База всех навыков", allBase]];
    mults = [["Catching level / 200", "Уровень ловли / 200", 1 + lv / 200], ["AGI curve", "Кривая ловкости", 1 + Math.pow(a * t / 100, .35) * t2],
      ["Cards, vials, gear, achievement 351", "Карты, флаконы, снаряжение, достижение 351", 1 + (M.card(32) + M.vial("CatchEff") + M.etc("18") + 10 * M.ach(351)) / 100],
      ["Star signs", "Знаки зодиака", 1 + M.sign("CatchingEff") / 100], ["Talent 295 × (atom + log oak logs)", "Талант 295 × (атом + log дуба)", 1 + T(1, 295) * (atomBonus(1) + getLOG(ownedItem("OakTree"))) / 100],
      ["Tool power % + achievement 74", "Сила инструмента % + достижение 74", 1 + (tool + Math.min(5, 5 * M.ach(74))) / 100], ["Talent 263", "Талант 263", 1 + T(1, 263) / 100]];
  }
  mults.push(["All skills multiplier", "Множитель всех навыков", all.total], ["Gear power stats, post office, star talents, monument, rift, voting, sets, golden food", "Силы снаряжения, почта, звёздные таланты, монумент, рифт, голосование, сеты, золотая еда", null]);
  const total = sumT(base) * prodT(mults);
  return { total, show: num(total), groups: [{ en: "Base", ru: "База", sum: num(sumT(base)), terms: base }, { en: "Multipliers", ru: "Множители", sum: "×" + num(prodT(mults)), terms: mults }] };
}
function sexpFormula(sk){
  const { M, T, lv } = toolSkill(sk), all = skillExpFormula().total;
  const mf = M.bubble("MinFishEXP") || 0;
  const terms = {
    Mining: [["Talents 104, 75", "Таланты 104, 75", T(1, 104) + T(1, 75)], ["Stamps", "Штампы", M.stamp("MinExp")], ["Cards", "Карты", M.card(25)], ["Bubble (x2 if below fishing)", "Пузырь (×2 если ниже рыбалки)", M.skill(1) < M.skill(4) ? 2 * mf : mf], ["Arcade 3", "Аркада 3", M.arcade(3)], ["Achievement 27", "Достижение 27", M.ach(27)], ["Gear", "Снаряжение", M.etc("55")]],
    Choppin: [["Talents 464, 75", "Таланты 464, 75", T(1, 464) + T(1, 75)], ["Stamps", "Штампы", M.stamp("ChopExp")], ["Bubble ChopAlchEXP", "Пузырь ChopAlchEXP", M.bubble("ChopAlchEXP")], ["Cards", "Карты", M.card(28)], ["Achievement 4", "Достижение 4", M.ach(4)]],
    Fishing: [["Talents 117, 104, 75", "Таланты 117, 104, 75", T(1, 117) + T(1, 104) + T(1, 75)], ["Bubble (x2 if below mining)", "Пузырь (×2 если ниже добычи)", M.skill(4) < M.skill(1) ? 2 * mf : mf], ["Cards", "Карты", M.card(31)], ["Stamps", "Штампы", M.stamp("FishExp")], ["Arcade 4", "Аркада 4", M.arcade(4)], ["Achievement 117", "Достижение 117", M.ach(117)], ["Gear", "Снаряжение", M.etc("49")], ["Bribe 29", "Взятка 29", 25 * M.bribe(29)], ["Vault 30", "Хранилище 30", M.vault(30)], ["Fishing toolkit", "Набор рыбака", null]],
    Catching: [["Talents 265, 297, 75", "Таланты 265, 297, 75", T(1, 265) + T(1, 297) + T(1, 75)], ["Cards", "Карты", M.card(40)], ["Stamps", "Штампы", M.stamp("CatchExp")], ["Arcade 9", "Аркада 9", M.arcade(9)], ["Achievement 107", "Достижение 107", M.ach(107)], ["Vault 29", "Хранилище 29", M.vault(29)]],
  }[sk];
  terms.push(["Rift, voting, Roo, star talents", "Рифт, голосование, Ру, звёздные таланты", null]);
  const mult = 1 + M.comp(32);
  const total = Math.max(.1, mult * (1 + sumT(terms) / 100) + all / 100);
  return { total, show: "×" + num(total), groups: [{ en: "Skill bonuses (× companion 32)", ru: "Бонусы навыка (× компаньон 32)", sum: "+" + num(sumT(terms)) + "%", terms },
    { en: "All skills EXP", ru: "Опыт всех навыков", sum: "+" + num(all) + "%", terms: [["See 'Skill EXP'", "См. «Опыт навыков»", all]] }] };
}
const FORMULAS = { mineff: () => effFormula("Mining"), chopeff: () => effFormula("Choppin"), fisheff: () => effFormula("Fishing"), catcheff: () => effFormula("Catching"),
  minexp: () => sexpFormula("Mining"), chopexp: () => sexpFormula("Choppin"), fishexp: () => sexpFormula("Fishing"), catchexp: () => sexpFormula("Catching"),
  coins: coinsFormula, fightafk: fightAfkFormula, skilleff: skillEffFormula, skillexp: skillExpFormula, move: moveFormula, hp: hpFormula, mp: mpFormula, critc: critcFormula, critd: critdFormula, def: defFormula, acc: accFormula, wp: wpFormula, classexp: expFormula, luk: () => statFormula("LUK"), str: () => statFormula("STR"), agi: () => statFormula("AGI"), wis: () => statFormula("WIS"), drop: dropFormula };
function formulaHtml(id){
  if (!acct || !FORMULAS[id]) return "";
  let f;
  try { f = FORMULAS[id](); } catch (e) { return `<p class="hint">${esc(e.message)}</p>`; }
  const missing = f.groups.reduce((s, g) => s + g.terms.filter(t => t[2] == null).length, 0);
  return `<div class="card formula"><div class="res-head"><h2>${L.f_title}</h2><b class="ftot">${f.show}</b><span class="n">${L.f_char(acct.chars[charN].name)}</span></div>` +
    f.groups.map(g => `<div class="fg"><div class="fgh"><span>${esc(g[lang])}</span><b>${g.sum}</b></div>${g.terms.map(t =>
      `<div class="ft${t[2] == null ? " nc" : !t[2] ? " off" : ""}"><span>${esc(lang === "ru" ? t[1] : t[0])}</span><b>${t[2] == null ? L.f_nc : num(t[2])}</b></div>`).join("")}</div>`).join("") +
    `<p class="hint">${L.f_note(missing)}</p></div>`;
}

// ---------- page ----------
// texts keep the game's placeholders: { } $ ^ ~ are numbers the game fills in; with a save, { and } get the value
const fmt = (s, hl, val, x) => {
  let h = esc(s);
  if (hl) h = h.replace(hl, m => "<mark>" + m + "</mark>");
  const only2 = !s.includes("{");   // a text with only } shows the main value there ("}x Cooking Speed")
  return h.replace(/[{}$^~](x?)/g, (m, xx) => {
    const ch = m[0];
    if (val && (val.lv > 0 || (val.lv == null && val.on))) {
      if (ch === "{" && val.v != null) return '<i class="v">' + num(val.v) + "</i>" + xx;
      if (ch === "}" && val.v2 != null) return '<i class="v">' + num(val.v2) + "</i>" + xx;
      if (ch === "}" && only2 && val.v != null) return '<i class="v">' + num(xx ? asMult(x, val.v) : val.v) + "</i>" + xx;
    }
    return '<i class="n">#</i>' + xx;
  });
};
const name = x => lang === "ru" ? (x[2] || x[1]) : x[1];
const text = x => lang === "ru" ? (x[4] || x[3]) : x[3];
const other = x => lang === "ru" ? (x[4] ? x[3] : "") : (x[4] || "");

function renderCats(){
  $("#cats").innerHTML = D.cats.map(c => `<div class="cat"><h3>${esc(c[lang])}</h3><div class="chips">${
    c.stats.map(s => `<button type="button" class="chip" data-stat="${s.id}" aria-pressed="${s.id === stat && !query}">${esc(s[lang])}<b>${s.hits.length}</b></button>`).join("")
  }</div></div>`).join("");
}

function rowHtml(x, val, hl){
  const alt = showAlt && other(x) ? `<div class="alt">${fmt(other(x), hl, val, x)}</div>` : "";
  const head = `<div class="nm">${fmt(name(x), hl)}</div><div class="txw"><div class="tx">${fmt(text(x), hl, val, x)}</div>${alt}</div>`;
  if (!acct) return `<div class="row">${head}</div>`;
  if (!val) return `<div class="row off">${head}<div class="lv"></div><div class="val"><small>${L.unread}</small></div></div>`;
  const u = unit(x[3]), shown = val.v == null ? "" : u === "x" ? "×" + num(asMult(x, val.v)) : "+" + num(val.v) + (u === "%" ? "%" : "");
  return `<div class="row${val.on ? "" : " off"}">${head}<div class="lv">${val.lv != null ? L.lvl + " " + num(val.lv) : ""}</div>` +
    `<div class="val">${val.on || val.v ? shown : "0"}${val.note ? `<small>${esc(val.note)}</small>` : ""}</div></div>`;
}

function renderOut(){
  let hits, title, hl = null;
  if (query) {
    if (query.length < 3) { $("#out").innerHTML = `<p class="empty">${L.short}</p>`; return; }
    const q = query.toLowerCase();
    hits = D.src.map((x, i) => i).filter(i => { const x = D.src[i]; return (x[3] + "\n" + (x[4] || "") + "\n" + x[1] + "\n" + (x[2] || "")).toLowerCase().includes(q); });
    title = L.searchTitle(query);
    hl = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  } else if (STATS[stat]) {
    hits = STATS[stat].hits; title = STATS[stat][lang];
  } else { $("#out").innerHTML = `<p class="empty">${L.pick}</p>`; return; }

  const vals = new Map(); hits.forEach(i => vals.set(i, value(D.src[i])));
  let shownHits = hits;
  if (acct && onlyOn) shownHits = hits.filter(i => vals.get(i) && vals.get(i).on);
  const by = new Map();
  shownHits.forEach(i => { const s = D.src[i][0]; if (!by.has(s)) by.set(s, []); by.get(s).push(i); });
  // inside a system: working bonuses first (biggest value first), then the rest in game order
  const rank = i => { const v = vals.get(i); return v && v.on ? 2 : v ? 1 : 0; };
  by.forEach(arr => arr.sort((a, b) => rank(b) - rank(a) || (rank(a) === 2 ? (vals.get(b).v || 0) - (vals.get(a).v || 0) : 0) || a - b));
  const onCount = s => by.get(s).filter(i => vals.get(i) && vals.get(i).on).length;
  const order = [...by.keys()].sort((a, b) => (acct ? onCount(b) - onCount(a) : 0) || by.get(b).length - by.get(a).length || a - b);
  const many = shownHits.length > 60;

  let tot = "";
  if (acct) {
    let pct = 0, flat = 0, mult = 1, nOn = 0, nRead = 0, hasMult = false;
    hits.forEach(i => {
      const v = vals.get(i); if (!v) return; nRead++;
      if (!v.on || !v.v) return; nOn++;
      const u = unit(D.src[i][3]);
      if (u === "%") pct += v.v; else if (u === "x") { mult *= Math.max(asMult(D.src[i], v.v), 0) || 1; hasMult = true; } else flat += v.v;
    });
    const charPick = `<label>${L.char} <select id="charSel">${acct.chars.map(c => `<option value="${c.n}"${c.n === charN ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>`;
    tot = `<div class="totals">${pct ? `<div class="tot"><b>+${num(pct)}%</b><span>${L.t_pct}</span></div>` : ""}${flat ? `<div class="tot"><b>+${num(flat)}</b><span>${L.t_flat}</span></div>` : ""}${hasMult ? `<div class="tot"><b>×${num(mult)}</b><span>${L.t_mult}</span></div>` : ""}<div class="tot"><b>${nOn}</b><span>${L.t_count(nOn, nRead)}</span></div></div>
      <div class="tools">${charPick}<label><input type="checkbox" id="onlyOn"${onlyOn ? " checked" : ""}> ${L.only_on}</label></div>
      <p class="hint">${L.tot_note}</p>`;
  } else tot = `<p class="hint">${L.nosave}</p>`;

  $("#out").innerHTML = `<div class="res-head"><h2>${esc(title)}</h2><span class="n">${L.found(hits.length)} ${L.systems(new Set(hits.map(i => D.src[i][0])).size)}</span></div>` +
    (!query ? formulaHtml(stat) : "") + tot +
    `<div class="tools"><button type="button" class="lnk" id="openAll">${L.open_all}</button><button type="button" class="lnk" id="closeAll">${L.close_all}</button>
    <label><input type="checkbox" id="alt"${showAlt ? " checked" : ""}> ${L.alt}</label></div>` +
    (shownHits.length ? order.map(s => {
      const on = acct ? onCount(s) : 0;
      return `<details class="sys"${many ? "" : " open"}><summary>${esc(D.systems[s][lang])} <span class="c">${by.get(s).length}</span>${acct && on ? `<span class="sv">✓ ${on}</span>` : ""}</summary><div class="rows${acct ? "" : " nosave"}">${
        by.get(s).map(i => rowHtml(D.src[i], vals.get(i), hl)).join("")
      }</div></details>`;
    }).join("") : `<p class="empty">${L.none}</p>`);
}

function applyLang(){
  L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = typeof L[e.dataset.i] === "string" ? L[e.dataset.i] : "");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#q").placeholder = L.search; $("#nick").placeholder = "IdleOn nick"; $("#save").placeholder = "{ … }";
  $("#build").textContent = D.build ? L.build(D.build) : "";
  renderCats(); renderOut();
}
let lastMsg = null;
function showMsg(kind, key, arg){
  lastMsg = [kind, key, arg];
  const v = L[key]; $("#msg").className = "msg " + (kind === "ok" ? "ok" : "err");
  $("#msg").textContent = typeof v === "function" ? v(arg) : v || "";
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("sf-lang", lang); applyLang(); if (lastMsg) showMsg(...lastMsg); });
$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-stat]"); if (!b) return;
  stat = b.dataset.stat; query = ""; $("#q").value = ""; store.set("sf-stat", stat);
  renderCats(); renderOut();
});
let tmr;
$("#q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { query = e.target.value.trim(); renderCats(); renderOut(); }, 150); });
$("#out").addEventListener("click", e => {
  if (e.target.id === "openAll" || e.target.id === "closeAll") document.querySelectorAll("details.sys").forEach(d => d.open = e.target.id === "openAll");
});
$("#out").addEventListener("change", e => {
  if (e.target.id === "alt") { showAlt = e.target.checked; store.set("sf-alt", showAlt ? "1" : "0"); }
  else if (e.target.id === "onlyOn") { onlyOn = e.target.checked; store.set("sf-on", onlyOn ? "1" : "0"); }
  else if (e.target.id === "charSel") { charN = Number(e.target.value); store.set("sf-char", charN); }
  else return;
  renderOut();
});

function load(text, key, arg){
  try { setAccount(parseSave(text)); showMsg("ok", key || "ok", arg); return true; }
  catch (e) { showMsg("err", e.message === "nokey" ? "e_nokey" : null, e.message); if (e.message !== "nokey") $("#msg").textContent = e.message; return false; }
}
const isNick = s => /^[A-Za-z0-9_\-]{2,30}$/.test(s.trim());
async function loadNick(nm){
  nm = nm.trim(); if (!isNick(nm)) return;
  $("#nick").value = nm;
  const btn = $("#nickBtn"); btn.disabled = true;
  showMsg("ok", "nick_loading", nm);
  try {
    const r = await fetch(`https://cdn.idleonefficiency.com/profiles/${encodeURIComponent(nm.toLowerCase())}.json?t=${Date.now()}`, { cache: "no-store" });  // the CDN keeps profiles up to 30 min; the query skips stale copies
    if (!r.ok) { showMsg("err", "e_nick", { name: nm, status: r.status }); return; }
    const lm = Date.parse(r.headers.get("last-modified") || ""), when = isNaN(lm) ? "" : new Date(lm).toLocaleString(loc(), { dateStyle: "short", timeStyle: "short" });
    if (load(await r.text(), "ok_nick", { name: nm, when })) { store.set("sf-nick", nm); store.set("sf-src", "nick"); store.del("sf-save"); }
  } catch (e) { showMsg("err", "e_nickfail", { name: nm, err: e.message }); }
  finally { btn.disabled = false; }
}
$("#nickForm").addEventListener("submit", e => { e.preventDefault(); loadNick($("#nick").value); });
$("#go").addEventListener("click", () => {
  const t = $("#save").value;
  if (isNick(t)) { loadNick(t); return; }
  if (load(t)) { store.set("sf-save", t); store.set("sf-src", "raw"); $("#save").value = ""; }
});
$("#save").addEventListener("paste", () => setTimeout(() => $("#go").click(), 0));
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { $("#save").value = t; $("#go").click(); }); e.target.value = ""; });
$("#forget").addEventListener("click", () => {
  for (const k of ["sf-save", "sf-src", "sf-nick"]) store.del(k);
  $("#nick").value = ""; try { history.replaceState(null, "", location.pathname); } catch(e){}
  setAccount(null); showMsg("ok", "forgot");
});

// #stat-id opens a stat; #Nick loads a profile (the miniToolBox passes the nick this way)
const h = decodeURIComponent(location.hash.slice(1));
if (STATS[h]) stat = h;
applyLang();
if (!STATS[h] && isNick(h)) loadNick(h);
else if (store.get("sf-src") === "nick" && store.get("sf-nick")) loadNick(store.get("sf-nick"));
else { const s = store.get("sf-save"); if (s) load(s, "ok_saved"); }
</script>
